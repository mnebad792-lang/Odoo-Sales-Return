<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحليل ومقارنة الفرق والمناديب</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --dark-color: #1e293b;
            --bg-color: #f8fafc;
            --border-color: #cbd5e1;
            --team-header-bg: #e2e8f0;
            --team-total-bg: #f1f5f9;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--dark-color); margin: 0; padding: 8px; }
        .container { max-width: 100%; margin: 0 auto; background: #ffffff; padding: 12px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h2 { text-align: center; color: var(--dark-color); margin-bottom: 12px; font-size: 16px; }
        .upload-section { background: #eff6ff; border: 2px dashed #3b82f6; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        #statusText { font-weight: bold; color: #1e40af; font-size: 11px; }
        .quick-search-panel { background: #f1f5f9; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .quick-search-title { font-weight: bold; font-size: 11px; margin-bottom: 6px; color: #334155; }
        .search-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; align-items: flex-end; }
        .search-field-group { display: flex; flex-direction: column; }
        .search-field-group label { font-size: 10px; font-weight: bold; margin-bottom: 2px; color: #475569; }
        .search-field-group input, .search-field-group select { padding: 5px 6px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 10px; background: white; outline: none; width: 100%; box-sizing: border-box; }
        .btn-search-action { background-color: var(--primary-color); color: white; border: none; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; height: 27px; width: 100%; }
        .actions-bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        button.action-btn { padding: 5px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 11px; }
        .btn-reset { background-color: #64748b; } .btn-excel { background-color: var(--success-color); } .btn-pdf { background-color: #0284c7; } .btn-print { background-color: #4f46e5; } .btn-compare { background-color: #d97706; font-size: 11px; padding: 7px 12px; }
        .table-container { width: 100%; overflow-x: auto; max-height: 550px; border: 1px solid var(--border-color); border-radius: 8px; background: white; }
        table { width: 100%; border-collapse: collapse; table-layout: auto; }
        th, td { padding: 6px 8px; text-align: center; border-bottom: 1px solid #e2e8f0; border-left: 1px solid #e2e8f0; font-size: 8pt !important; white-space: normal; word-break: break-word; }
        th.col-rep, td.col-rep { min-width: 130px; text-align: right; }
        th.col-client, td.col-client { min-width: 200px; text-align: right; }
        th.col-product, td.col-product { min-width: 220px; text-align: right; }
        th { background-color: var(--dark-color); color: white; font-weight: bold !important; position: sticky; top: 0; z-index: 10; }
        .team-group-header { background-color: var(--team-header-bg) !important; font-weight: bold !important; color: #0f172a !important; text-align: right !important; font-size: 9pt !important; border-top: 2px solid #94a3b8; }
        .team-total-row { background-color: var(--team-total-bg) !important; font-weight: bold !important; color: #0369a1 !important; border-top: 1px solid #0284c7; border-bottom: 2px solid #0284c7; }
        tr:hover { background-color: #f8fafc; }
        .row-count { margin-top: 5px; font-weight: bold; color: #475569; font-size: 11px; }
        #reportModalContainer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8fafc; z-index: 9998; padding: 15px; box-sizing: border-box; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="container">
        <h2>نظام تحليل ومقارنة الفرق والمناديب (مبيعات، مرتجعات، صافي والاتجاهات)</h2>

        <div class="upload-section">
            <div>
                <span id="statusText">🔄 جاري جلب أحدث البيانات من Google Drive...</span>
            </div>
            <div>
                <button class="action-btn" onclick="loadGoogleDriveData()" style="font-size: 11px; background-color: #2563eb;">🔄 تحديث البيانات الآن</button>
            </div>
        </div>

        <div style="text-align: center; margin: 10px 0;">
            <button class="action-btn btn-compare" onclick="openTeamsAndRepsReport()">⚖️ عرض تقرير تسلسل الفرق والمناديب التفصيلي</button>
        </div>

        <div class="quick-search-panel">
            <div class="quick-search-title">🔍 محرك الفلاتر الشامل:</div>
            <div class="search-grid">
                <div class="search-field-group">
                    <label>العميل:</label>
                    <input type="text" id="searchClient" placeholder="ابحث عن العميل...">
                </div>
                <div class="search-field-group">
                    <label>مندوب المبيعات:</label>
                    <input type="text" id="searchRep" placeholder="ابحث عن المندوب...">
                </div>
                <div class="search-field-group">
                    <label>فريق المبيعات:</label>
                    <input type="text" id="searchTeam" placeholder="ابحث عن الفريق...">
                </div>
                <div class="search-field-group">
                    <label>السنة:</label>
                    <select id="filterYear"><option value="">كل السنوات</option></select>
                </div>
                <div class="search-field-group">
                    <label>الشهر:</label>
                    <select id="filterMonth">
                        <option value="">كل الشهور</option>
                        <option value="1">يناير</option><option value="2">فبراير</option><option value="3">مارس</option>
                        <option value="4">أبريل</option><option value="5">مايو</option><option value="6">يونيو</option>
                        <option value="7">يوليو</option><option value="8">أغسطس</option><option value="9">سبتمبر</option>
                        <option value="10">أكتوبر</option><option value="11">نوفمبر</option><option value="12">ديسمبر</option>
                    </select>
                </div>
                <div>
                    <button class="btn-search-action" onclick="executeMainTableFiltering()">🔍 تطبيق الفلاتر</button>
                </div>
            </div>
        </div>

        <div class="actions-bar">
            <button class="action-btn btn-reset" onclick="resetFilter()">🔄 إعادة ضبط</button>
            <button class="action-btn btn-excel" onclick="exportToExcel()">📊 تصدير Excel</button>
            <button class="action-btn btn-pdf" onclick="exportToPDFFile()">📥 تصدير PDF</button>
            <button class="action-btn btn-print" onclick="printReport()">🖨️ طباعة</button>
        </div>

        <div class="row-count" id="rowCount">عدد السجلات الإجمالي: 0</div>

        <div class="table-container">
            <table id="mainTable">
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- نافذة التقرير التفصيلي -->
    <div id="reportModalContainer">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h2 style="margin: 0; color: #2563eb; font-size: 15px;">⚖️ تقرير تسلسل الفرق والمناديب</h2>
            <button class="action-btn btn-reset" onclick="closeReportModal()">✖ العودة</button>
        </div>
        <div class="table-container" style="max-height: 70vh;">
            <table id="popupTable">
                <thead id="popupHeader"></thead>
                <tbody id="popupBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let globalAllData = [];
        let tableHeaders = [];
        let masterYears = new Set();
        let detectedIndices = { teamIdx: -1, repIdx: -1, clientIdx: -1, productIdx: -1, dateIdx: -1, invoiceDateIdx: -1, valIdx: -1, invoiceColIndex: -1 };

        // تم ضبط الرابط الذي أرسلته مباشرة في المتغير أدناه
        const GOOGLE_DRIVE_SHARE_URL = 'https://docs.google.com/spreadsheets/d/1SVnlPRdw9bNqaA76RM7qa4advkC_nybW/edit?usp=sharing&ouid=111012112981771520827&rtpof=true&sd=true';

        function convertDriveUrlToDirect(url) {
            let fileId = "";
            if (url.includes('/d/')) {
                fileId = url.split('/d/')[1].split('/')[0];
            } else if (url.includes('id=')) {
                fileId = url.split('id=')[1].split('&')[0];
            }
            if (!fileId) return url;
            return `https://docs.google.com/uc?export=download&id=${fileId}`;
        }

        function loadGoogleDriveData() {
            document.getElementById('statusText').innerText = `🔄 جاري جلب الملف من Google Drive...`;
            let directUrl = convertDriveUrlToDirect(GOOGLE_DRIVE_SHARE_URL);
            let proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(directUrl);

            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) throw new Error("تعذر جلب الملف. تأكد أن الملف مشترك للعامة.");
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    let data = new Uint8Array(buffer);
                    let workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    let sheetName = workbook.SheetNames.includes("Data") ? "Data" : workbook.SheetNames[0];
                    let worksheet = workbook.Sheets[sheetName];
                    let jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                    let cleanRows = jsonRows.filter(row => row && row.some(cell => cell !== ""));

                    if (cleanRows && cleanRows.length > 0) {
                        tableHeaders = cleanRows[0];
                        globalAllData = cleanRows.slice(1);
                        document.getElementById('statusText').innerText = `✅ تم تحديث البيانات بنجاح (${globalAllData.length.toLocaleString()} سجل).`;
                        detectColumnsAutomatically();
                        extractYears();
                        renderTableRows(globalAllData);
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('statusText').innerText = `❌ خطأ في التحميل. تأكد من إعدادات مشاركة الملف في جوجل درايف ليصبح (أي شخص لديه الرابط).`;
                });
        }

        window.onload = function() { 
            loadGoogleDriveData(); 
        };

        function detectColumnsAutomatically() {
            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('فريق') || hStr.includes('team')) detectedIndices.teamIdx = idx;
                if (hStr.includes('مندوب') || hStr.includes('rep')) detectedIndices.repIdx = idx;
                if (hStr.includes('عميل') || hStr.includes('customer')) detectedIndices.clientIdx = idx;
                if (hStr.includes('منتج') || hStr.includes('item') || hStr.includes('product')) detectedIndices.productIdx = idx;
                if ((hStr.includes('تاريخ') || hStr.includes('date')) && hStr.includes('طلب')) detectedIndices.dateIdx = idx;
                if ((hStr.includes('تاريخ') || hStr.includes('date')) && hStr.includes('فاتورة')) detectedIndices.invoiceDateIdx = idx;
                if (hStr.includes('مبلغ') || hStr.includes('قيمة') || hStr.includes('بدون') || hStr.includes('إجمالي')) detectedIndices.valIdx = idx;
                if (hStr.includes('رقم') && (hStr.includes('فاتورة') || hStr.includes('invoice'))) detectedIndices.invoiceColIndex = idx;
            });
            if (detectedIndices.teamIdx === -1) detectedIndices.teamIdx = 0;
            if (detectedIndices.repIdx === -1) detectedIndices.repIdx = 1;
            if (detectedIndices.clientIdx === -1) detectedIndices.clientIdx = 2;
            if (detectedIndices.productIdx === -1) detectedIndices.productIdx = 3;
            if (detectedIndices.dateIdx === -1) detectedIndices.dateIdx = 4;
            if (detectedIndices.valIdx === -1) detectedIndices.valIdx = 5;
        }

        function parseRowDate(val) {
            if (!val && val !== 0) return null;
            if (val instanceof Date && !isNaN(val)) return val;
            if (typeof val === 'number' && val > 30000 && val < 60000) {
                let utcDays = Math.floor(val - 25569);
                return new Date(utcDays * 86400 * 1000);
            }
            let strVal = String(val).trim();
            let parsed = new Date(strVal);
            if (!isNaN(parsed)) return parsed;
            return null;
        }

        function formatDateClean(val) {
            let d = parseRowDate(val);
            if (!d) return String(val !== undefined ? val : '').replace(/\(.*\)/g, '').trim();
            let yy = d.getFullYear();
            let mm = String(d.getMonth() + 1).padStart(2, '0');
            let dd = String(d.getDate()).padStart(2, '0');
            return `${yy}-${mm}-${dd}`;
        }

        function extractYears() {
            let dateIdx = detectedIndices.dateIdx;
            masterYears.clear();
            globalAllData.forEach(row => {
                if (dateIdx !== -1) {
                    let d = parseRowDate(row[dateIdx]);
                    if (d) masterYears.add(d.getFullYear());
                }
            });
            let yearSelect = document.getElementById('filterYear');
            let yearsHtml = '<option value="">كل السنوات</option>';
            Array.from(masterYears).sort((a,b)=>a-b).forEach(y => { yearsHtml += `<option value="${y}">${y}</option>`; });
            yearSelect.innerHTML = yearsHtml;
        }

        function renderTableRows(rowsToRender) {
            if (tableHeaders.length === 0) return;
            let headerHtml = '<tr>';
            tableHeaders.forEach((h, idx) => {
                let cssClass = '';
                if (idx === detectedIndices.repIdx) cssClass = 'col-rep';
                else if (idx === detectedIndices.clientIdx) cssClass = 'col-client';
                else if (idx === detectedIndices.productIdx) cssClass = 'col-product';
                headerHtml += `<th class="${cssClass}">${h}</th>`;
            });
            headerHtml += '</tr>';
            document.getElementById('tableHeader').innerHTML = headerHtml;

            let chunkSize = 500, index = 0;
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            function appendChunk() {
                let chunk = rowsToRender.slice(index, index + chunkSize);
                let bodyHtml = '';
                chunk.forEach(row => {
                    bodyHtml += '<tr>';
                    row.forEach((cell, cellIdx) => {
                        let displayVal = cell;
                        if (cellIdx === detectedIndices.dateIdx || String(tableHeaders[cellIdx] || "").toLowerCase().includes('تاريخ')) {
                            displayVal = formatDateClean(cell);
                        }
                        let cssClass = '';
                        if (cellIdx === detectedIndices.repIdx) cssClass = 'col-rep';
                        else if (cellIdx === detectedIndices.clientIdx) cssClass = 'col-client';
                        else if (cellIdx === detectedIndices.productIdx) cssClass = 'col-product';
                        bodyHtml += `<td class="${cssClass}">${displayVal !== undefined ? displayVal : ''}</td>`;
                    });
                    bodyHtml += '</tr>';
                });
                tbody.insertAdjacentHTML('beforeend', bodyHtml);
                index += chunkSize;
                if (index < rowsToRender.length) setTimeout(appendChunk, 0);
            }
            appendChunk();
            document.getElementById('rowCount').innerText = `عدد السجلات المعروضة: ${rowsToRender.length.toLocaleString()}`;
        }

        function executeMainTableFiltering() {
            let clientQ = document.getElementById('searchClient').value.toLowerCase().trim();
            let repQ = document.getElementById('searchRep').value.toLowerCase().trim();
            let teamQ = document.getElementById('searchTeam').value.toLowerCase().trim();
            let yearQ = document.getElementById('filterYear').value.trim();
            let monthQ = document.getElementById('filterMonth').value.trim();

            let filtered = globalAllData.filter(row => {
                if (clientQ && detectedIndices.clientIdx !== -1 && !String(row[detectedIndices.clientIdx] || "").toLowerCase().includes(clientQ)) return false;
                if (repQ && detectedIndices.repIdx !== -1 && !String(row[detectedIndices.repIdx] || "").toLowerCase().includes(repQ)) return false;
                if (teamQ && detectedIndices.teamIdx !== -1 && !String(row[detectedIndices.teamIdx] || "").toLowerCase().includes(teamQ)) return false;
                if (detectedIndices.dateIdx !== -1) {
                    let d = parseRowDate(row[detectedIndices.dateIdx]);
                    if (d) {
                        if (yearQ && String(d.getFullYear()) !== yearQ) return false;
                        if (monthQ && String(d.getMonth() + 1) !== monthQ) return false;
                    } else if (yearQ || monthQ) return false;
                }
                return true;
            });
            renderTableRows(filtered);
        }

        function resetFilter() {
            document.getElementById('searchClient').value = '';
            document.getElementById('searchRep').value = '';
            document.getElementById('searchTeam').value = '';
            document.getElementById('filterYear').value = '';
            document.getElementById('filterMonth').value = '';
            renderTableRows(globalAllData);
        }

        function calculateReportData() {
            let { teamIdx, repIdx, dateIdx, valIdx, invoiceColIndex } = detectedIndices;
            let hierarchy = {}, yearsSet = new Set();

            globalAllData.forEach(row => {
                let teamName = String(row[teamIdx] || "فريق غير محدد").trim();
                let repName = String(row[repIdx] || "مندوب غير محدد").trim();
                let dObj = parseRowDate(row[dateIdx]);
                let year = dObj ? dObj.getFullYear() : "غير محدد";
                let amount = Number(row[valIdx]) || 0;
                let isReturn = (invoiceColIndex !== -1 && String(row[invoiceColIndex]).trim().toLowerCase().startsWith('rinv'));

                if (year !== "غير محدد") yearsSet.add(year);
                if (!hierarchy[teamName]) hierarchy[teamName] = {};
                if (!hierarchy[teamName][repName]) hierarchy[teamName][repName] = {};
                if (!hierarchy[teamName][repName][year]) hierarchy[teamName][repName][year] = { sales: 0, returns: 0 };

                if (isReturn) hierarchy[teamName][repName][year].returns += Math.abs(amount);
                else hierarchy[teamName][repName][year].sales += amount;
            });

            let sortedYears = Array.from(yearsSet).sort((a, b) => a - b);
            if (sortedYears.length === 0) sortedYears = [2025, 2026];

            let topHeaderHtml = `<tr><th rowspan="2">الفريق / المندوب</th>`;
            sortedYears.forEach(y => { topHeaderHtml += `<th colspan="3" style="background:#0284c7;">سنة ${y}</th>`; });
            topHeaderHtml += `<th colspan="3" style="background:#d97706;">المقارنة</th><th rowspan="2">الاتجاه</th></tr>`;

            let subHeaderHtml = `<tr>`;
            sortedYears.forEach(() => { subHeaderHtml += `<th>مبيعات</th><th>مرتجعات</th><th>صافي</th>`; });
            subHeaderHtml += `<th>فارق مبيعات</th><th>فارق مرتجعات</th><th>فارق صافي</th></tr>`;

            let tableRowsHtml = '';
            Object.keys(hierarchy).sort().forEach(team => {
                tableRowsHtml += `<tr class="team-group-header"><td colspan="${(sortedYears.length * 3) + 5}">📁 الفريق: ${team}</td></tr>`;
                Object.keys(hierarchy[team]).sort().forEach(rep => {
                    tableRowsHtml += `<tr><td style="text-align:right;">👤 ${rep}</td>`;
                    sortedYears.forEach(y => {
                        let yData = hierarchy[team][rep][y] || { sales: 0, returns: 0 };
                        let netY = yData.sales - yData.returns;
                        tableRowsHtml += `<td>${yData.sales.toLocaleString()}</td><td style="color:red;">${yData.returns.toLocaleString()}</td><td style="color:green; font-weight:bold;">${netY.toLocaleString()}</td>`;
                    });
                    tableRowsHtml += `<td colspan="4">--</td></tr>`;
                });
            });
            return { topHeaderHtml, subHeaderHtml, tableRowsHtml };
        }

        function openTeamsAndRepsReport() {
            if (globalAllData.length === 0) { alert("جاري تحميل البيانات..."); return; }
            let res = calculateReportData();
            document.getElementById('popupHeader').innerHTML = res.topHeaderHtml + res.subHeaderHtml;
            document.getElementById('popupBody').innerHTML = res.tableRowsHtml;
            document.getElementById('reportModalContainer').style.display = 'block';
        }

        function closeReportModal() { document.getElementById('reportModalContainer').style.display = 'none'; }
        function exportToExcel() { alert("تصدير Excel متاح عبر التقارير التفصيلية."); }
        function exportToPDFFile() { window.print(); }
        function printReport() { window.print(); }
    </script>
</body>
</html>
