<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام بحث وتصدير مبيعات الشركة المركزي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --dark-color: #1e293b;
            --bg-color: #f8fafc;
            --border-color: #cbd5e1;
            --return-row-bg: #fee2e2;
            --totals-bg: #e0f2fe;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-color);
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 15px;
            font-size: 18px;
        }

        .upload-section {
            background: #eff6ff;
            border: 2px dashed #3b82f6;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .upload-section input[type="file"] { display: none; }

        .custom-file-upload {
            background-color: #2563eb;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
            transition: background 0.2s;
        }
        .custom-file-upload:hover { background-color: #1d4ed8; }

        #statusText {
            font-weight: bold;
            color: #1e40af;
            font-size: 12px;
        }

        .quick-search-panel {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .quick-search-title {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 8px;
            color: #334155;
        }

        .search-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }

        .search-field-group {
            flex: 1;
            min-width: 140px;
            display: flex;
            flex-direction: column;
        }

        .search-field-group label {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #475569;
        }

        .search-field-group input, .search-field-group select {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 11px;
            background: white;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-search-action {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            height: 31px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-search-action:hover { background-color: #1d4ed8; }

        .actions-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        button.action-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }
        .btn-reset { background-color: #64748b; }
        .btn-excel { background-color: var(--success-color); }
        .btn-pdf { background-color: #0284c7; }
        .btn-print { background-color: #4f46e5; }
        .btn-compare { background-color: #d97706; font-size: 12px; padding: 8px 14px; }
        .btn-compare-client { background-color: #0d9488; font-size: 12px; padding: 8px 14px; }

        .table-container {
            width: 100%;
            overflow-x: auto;
            max-height: 550px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            padding: 4px 3px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
            border-left: 1px solid #e2e8f0;
            font-size: 7pt !important;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th {
            background-color: var(--dark-color);
            color: white;
            font-weight: bold !important;
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 7.5pt !important;
            text-align: center;
            white-space: normal;
        }

        tr.totals-row td {
            background-color: var(--totals-bg) !important;
            font-weight: bold !important;
            color: #0369a1 !important;
            border-top: 2px solid #0284c7;
            border-bottom: 2px solid #0284c7;
            position: sticky;
            top: 28px;
            z-index: 8;
            font-size: 7pt !important;
            white-space: nowrap !important;
            text-align: center;
        }

        tr:hover { background-color: #f1f5f9; }
        tr.return-row { background-color: var(--return-row-bg) !important; }

        .row-count {
            margin-top: 6px;
            font-weight: bold;
            color: #475569;
            font-size: 12px;
        }

        .print-title-header {
            display: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="container" id="reportContent">
        <h2>نظام بحث وتصدير مبيعات الشركة المركزي</h2>

        <div class="upload-section">
            <div>
                <span id="statusText">📂 جاري التحقق من وجود بيانات مخزنة مسبقاً...</span>
            </div>
            <div>
                <label for="excelFileinput" class="custom-file-upload" id="uploadLabel">
                    📁 رفع واختيار ملف الاكسيل الجديد
                </label>
                <input type="file" id="excelFileinput" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)">
            </div>
        </div>

        <div style="text-align: center; margin: 15px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
            <button class="action-btn btn-compare" onclick="openComparisonWindow()">⚖️ تقرير مقارنة السنوات (للمندوبين والفرق)</button>
            <button class="action-btn btn-compare-client" onclick="openClientComparisonWindow()">⚖️ تقرير مقارنة السنوات (للعملاء)</button>
        </div>

        <div class="quick-search-panel">
            <div class="quick-search-title">🔍 محرك البحث السريع:</div>
            <div class="search-grid">
                <div class="search-field-group">
                    <label>العميل:</label>
                    <input type="text" id="searchClient" placeholder="اسم العميل..." oninput="executeFiltering()">
                </div>
                <div class="search-field-group">
                    <label>مندوب المبيعات:</label>
                    <input type="text" id="searchRep" placeholder="اسم المندوب..." oninput="executeFiltering()">
                </div>
                <div class="search-field-group">
                    <label>فريق المبيعات:</label>
                    <input type="text" id="searchTeam" placeholder="فريق المبيعات..." oninput="executeFiltering()">
                </div>
                <div class="search-field-group">
                    <label>المنتج / الصنف:</label>
                    <input type="text" id="searchItem" placeholder="الصنف..." oninput="executeFiltering()">
                </div>
                <div>
                    <button class="btn-search-action" onclick="executeFiltering()">🔍 بحث</button>
                </div>
            </div>
        </div>

        <div class="actions-bar">
            <button class="action-btn btn-reset" onclick="resetFilter()">🔄 إعادة ضبط كافة الفلاتر</button>
            <button class="action-btn btn-excel" onclick="exportToExcel()">📊 تصدير Excel (بدون مرتجعات)</button>
            <button class="action-btn btn-pdf" onclick="exportToPDFFile()">📥 تصدير PDF (احتواء تلقائي Shrink to Fit)</button>
            <button class="action-btn btn-print" onclick="printReport()">🖨️ طباعة التقرير</button>
        </div>

        <div id="printTitleHeader" class="print-title-header">تقرير مبيعات الشركة</div>
        <div class="row-count" id="rowCount">عدد النتائج المعروضة: 0</div>

        <div class="table-container">
            <table id="mainTable">
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let globalAllData = [];
        let tableHeaders = [];
        let displayedRowsData = []; 
        let exportableRowsData = []; 
        let db;

        function initDB() {
            let request = indexedDB.open("SalesSystemDB", 35);
            request.onsuccess = function(event) {
                db = event.target.result;
                loadStoredData();
            };
            request.onupgradeneeded = function(event) {
                let dbTarget = event.target.result;
                if (!dbTarget.objectStoreNames.contains("files")) {
                    dbTarget.createObjectStore("files");
                }
            };
        }

        function saveToDB(headers, data, fileName) {
            if (!db) return;
            let transaction = db.transaction(["files"], "readwrite");
            let store = transaction.objectStore("files");
            // استخدام مفتاح موحد وتحديث البيانات القديمة بالجديدة تماماً
            store.put({ headers: headers, data: data, name: fileName }, "excelFile");
        }

        function loadStoredData() {
            if (!db) return;
            let transaction = db.transaction(["files"], "readonly");
            let store = transaction.objectStore("files");
            let request = store.get("excelFile");

            request.onsuccess = function(event) {
                let result = event.target.result;
                if (result && result.data && result.data.length > 0) {
                    tableHeaders = result.headers;
                    globalAllData = result.data;
                    displayedRowsData = [...globalAllData];
                    exportableRowsData = [...globalAllData];
                    document.getElementById('statusText').innerText = `⚡ تم استرجاع الملف المخزن بنجاح (${globalAllData.length} سجل).`;
                    document.getElementById('uploadLabel').innerText = '📁 استبدال الملف بآخر جديد';
                    renderTable();
                } else {
                    document.getElementById('statusText').innerText = `📂 يرجى اختيار ملف الاكسيل الخاص بالبيانات للبدء...`;
                }
            };
        }

        window.onload = function() { initDB(); };

        function formatExcelDate(val) {
            if (!val && val !== 0) return "";
            if (val instanceof Date && !isNaN(val)) {
                let d = String(val.getDate()).padStart(2, '0');
                let m = String(val.getMonth() + 1).padStart(2, '0');
                let y = val.getFullYear();
                return `${d}/${m}/${y}`;
            }
            if (typeof val === 'number' && val > 30000 && val < 60000) {
                let utcDays = Math.floor(val - 25569);
                let utcValue = utcDays * 86400;
                let dateInfo = new Date(utcValue * 1000);
                let d = String(dateInfo.getUTCDate()).padStart(2, '0');
                let m = String(dateInfo.getUTCMonth() + 1).padStart(2, '0');
                let y = String(dateInfo.getUTCFullYear());
                return `${d}/${m}/${y}`;
            }
            let strVal = String(val).trim();
            let parts = strVal.split(/[\/\-\.]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
                } else if (parts[2].length === 4) {
                    return `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[2]}`;
                }
            }
            return strVal;
        }

        function formatNumberCell(val) {
            if (val === "" || val === null || val === undefined) return "";
            let num = Number(val);
            if (!isNaN(num) && typeof val !== 'boolean') {
                let str = String(val).trim();
                if (str.length >= 10 && str.startsWith("0")) return str;
                return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            return val;
        }

        function handleExcelUpload(e) {
            let file = e.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    let sheetName = workbook.SheetNames.includes("Data") ? "Data" : workbook.SheetNames[0];
                    let worksheet = workbook.Sheets[sheetName];
                    let jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                    let cleanRows = jsonRows.filter(row => row && row.some(cell => cell !== ""));

                    if (cleanRows && cleanRows.length > 0) {
                        tableHeaders = cleanRows[0];
                        globalAllData = cleanRows.slice(1);
                        displayedRowsData = [...globalAllData];
                        exportableRowsData = [...globalAllData];
                        
                        // حفظ واستبدال البيانات القديمة فورا بأحدث نسخة
                        saveToDB(tableHeaders, globalAllData, file.name);

                        document.getElementById('statusText').innerText = `⚡ تم تحديث وحفظ الملف الجديد بنجاح (${globalAllData.length} سجل).`;
                        document.getElementById('uploadLabel').innerText = '📁 استبدال الملف بآخر جديد';
                        renderTable();
                        alert("تم تحديث البيانات بنجاح وعرض أحدث نسخة!");
                    } else {
                        alert("الملف المختار فارغ!");
                    }
                } catch (err) {
                    console.error(err);
                    alert("حدث خطأ أثناء قراءة الملف.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function getDynamicReportTitle() {
            let clientVal = document.getElementById('searchClient').value.trim();
            let repVal = document.getElementById('searchRep').value.trim();
            let teamVal = document.getElementById('searchTeam').value.trim();
            let itemVal = document.getElementById('searchItem').value.trim();
            let titleParts = ["تقرير مبيعات الشركة"];
            if (clientVal) titleParts.push(`للعميل: ${clientVal}`);
            if (repVal) titleParts.push(`للمندوب: ${repVal}`);
            if (teamVal) titleParts.push(`للفريق: ${teamVal}`);
            if (itemVal) titleParts.push(`للصنف: ${itemVal}`);
            return titleParts.join(" - ");
        }

        function executeFiltering() {
            let clientQuery = document.getElementById('searchClient').value.toLowerCase().trim();
            let repQuery = document.getElementById('searchRep').value.toLowerCase().trim();
            let teamQuery = document.getElementById('searchTeam').value.toLowerCase().trim();
            let itemQuery = document.getElementById('searchItem').value.toLowerCase().trim();

            let clientIdx = -1, repIdx = -1, teamIdx = -1, itemIdx = -1;
            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('عميل') || hStr.includes('customer')) clientIdx = idx;
                if (hStr.includes('مندوب') || hStr.includes('rep')) repIdx = idx;
                if (hStr.includes('فريق') || hStr.includes('team')) teamIdx = idx;
                if (hStr.includes('منتج') || hStr.includes('صنف') || hStr.includes('item')) itemIdx = idx;
            });

            let parseTerms = (q) => !q ? [] : q.split(/[,،]+/).map(t => t.trim()).filter(t => t.length > 0);
            let clientTerms = parseTerms(clientQuery);
            let repTerms = parseTerms(repQuery);
            let teamTerms = parseTerms(teamQuery);
            let itemTerms = parseTerms(itemQuery);

            exportableRowsData = globalAllData.filter(row => {
                if (clientTerms.length > 0 && clientIdx !== -1 && !clientTerms.some(term => String(row[clientIdx] || "").toLowerCase().includes(term))) return false;
                if (repTerms.length > 0 && repIdx !== -1 && !repTerms.some(term => String(row[repIdx] || "").toLowerCase().includes(term))) return false;
                if (teamTerms.length > 0 && teamIdx !== -1 && !teamTerms.some(term => String(row[teamIdx] || "").toLowerCase().includes(term))) return false;
                if (itemTerms.length > 0 && itemIdx !== -1 && !itemTerms.some(term => String(row[itemIdx] || "").toLowerCase().includes(term))) return false;
                return true;
            });

            displayedRowsData = [...exportableRowsData];
            document.getElementById('printTitleHeader').innerText = getDynamicReportTitle();
            renderTableBodyAndTotals();
        }

        function renderTable() {
            if (tableHeaders.length === 0) return;
            let headerHtml = '<tr>';
            tableHeaders.forEach((h) => { headerHtml += `<th>${h !== undefined ? h : ''}</th>`; });
            headerHtml += '</tr>';
            document.getElementById('tableHeader').innerHTML = headerHtml;
            executeFiltering();
        }

        function renderTableBodyAndTotals() {
            let bodyHtml = '';
            let invoiceColIndex = -1;
            let dateColIndices = [];
            let qtyColIndex = -1, discountValColIndex = -1, totalWithoutVatColIndex = -1, totalWithVatColIndex = -1;

            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('رقم') && (hStr.includes('فاتورة') || hStr.includes('invoice'))) invoiceColIndex = idx;
                if (hStr.includes('تاريخ') || hStr.includes('date')) dateColIndices.push(idx);
                if (hStr.includes('كمية') && hStr.includes('مفوترة')) qtyColIndex = idx;
                if (hStr.includes('مبلغ') && hStr.includes('خصم')) discountValColIndex = idx;
                
                if ((hStr.includes('بدون') && hStr.includes('ض')) || hStr === 'المبلغ' || hStr.includes('القيمة') || (hStr.includes('إجمالي') && !hStr.includes('شامل') && !hStr.includes('ض'))) {
                    if (totalWithoutVatColIndex === -1) totalWithoutVatColIndex = idx;
                }
                if (hStr.includes('شامل') && hStr.includes('ض')) totalWithVatColIndex = idx;
            });

            let sumQty = 0, sumDiscount = 0, sumWithoutVat = 0, sumWithVat = 0;
            displayedRowsData.forEach(row => {
                if (qtyColIndex !== -1) sumQty += Number(row[qtyColIndex]) || 0;
                if (discountValColIndex !== -1) sumDiscount += Number(row[discountValColIndex]) || 0;
                if (totalWithoutVatColIndex !== -1) sumWithoutVat += Number(row[totalWithoutVatColIndex]) || 0;
                if (totalWithVatColIndex !== -1) sumWithVat += Number(row[totalWithVatColIndex]) || 0;
            });

            let totalsRowHtml = '<tr class="totals-row">';
            tableHeaders.forEach((h, idx) => {
                let valStr = "";
                if (idx === 0) valStr = "الإجمالي:";
                else if (idx === qtyColIndex) valStr = sumQty.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                else if (idx === discountValColIndex) valStr = sumDiscount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                else if (idx === totalWithoutVatColIndex) valStr = sumWithoutVat.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                else if (idx === totalWithVatColIndex) valStr = sumWithVat.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                totalsRowHtml += `<td>${valStr}</td>`;
            });
            totalsRowHtml += '</tr>';

            displayedRowsData.slice(0, 1000).forEach(row => {
                let isReturn = false;
                if (invoiceColIndex !== -1 && row[invoiceColIndex]) {
                    let invVal = String(row[invoiceColIndex]).trim().toLowerCase();
                    if (invVal.startsWith('rinv')) isReturn = true;
                }
                bodyHtml += `<tr class="${isReturn ? 'return-row' : ''}">`;
                row.forEach((cell, cellIdx) => {
                    let formattedVal = dateColIndices.includes(cellIdx) ? formatExcelDate(cell) : formatNumberCell(cell);
                    bodyHtml += `<td>${formattedVal !== undefined && formattedVal !== null ? formattedVal : ''}</td>`;
                });
                bodyHtml += '</tr>';
            });

            let currentHeaderHtml = '<tr>';
            tableHeaders.forEach((h) => { currentHeaderHtml += `<th>${h !== undefined ? h : ''}</th>`; });
            currentHeaderHtml += '</tr>' + totalsRowHtml;

            document.getElementById('tableHeader').innerHTML = currentHeaderHtml;
            document.getElementById('tableBody').innerHTML = bodyHtml;
            document.getElementById('rowCount').innerText = `عدد النتائج المعروضة: ${displayedRowsData.length}`;
        }

        function resetFilter() {
            document.getElementById('searchClient').value = '';
            document.getElementById('searchRep').value = '';
            document.getElementById('searchTeam').value = '';
            document.getElementById('searchItem').value = '';
            displayedRowsData = [...globalAllData];
            exportableRowsData = [...globalAllData];
            renderTableBodyAndTotals();
            document.getElementById('printTitleHeader').innerText = "تقرير مبيعات الشركة";
            document.getElementById('statusText').innerText = `⚡ تم إعادة ضبط كافة الفلاتر وعرض كافة السجلات.`;
        }

        function exportToExcel() {
            if (exportableRowsData.length === 0) { alert("لا توجد بيانات للتصدير!"); return; }
            let invoiceColIndex = -1;
            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('رقم') && (hStr.includes('فاتورة') || hStr.includes('invoice'))) invoiceColIndex = idx;
            });
            let cleanExportRows = exportableRowsData.filter(row => {
                if (invoiceColIndex !== -1 && row[invoiceColIndex]) {
                    if (String(row[invoiceColIndex]).trim().toLowerCase().startsWith('rinv')) return false;
                }
                return true;
            });
            let reportTitle = getDynamicReportTitle();
            let exportData = [[reportTitle], [], tableHeaders, ...cleanExportRows];
            let ws = XLSX.utils.aoa_to_sheet(exportData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "التقرير");
            XLSX.writeFile(wb, reportTitle.replace(/[:\/\\?*]/g, "_") + ".xlsx");
        }

        function exportToPDFFile() {
            if (exportableRowsData.length === 0) { alert("لا توجد بيانات للتصدير!"); return; }
            document.getElementById('printTitleHeader').style.display = 'block';
            let element = document.getElementById('reportContent');
            // خاصية Shrink to Fit (احتواء تلقائي للصفحة بعرض A4)
            let opt = { 
                margin: [5, 5, 5, 5], 
                filename: getDynamicReportTitle() + '.pdf', 
                image: { type: 'jpeg', quality: 0.98 }, 
                html2canvas: { scale: 1.5, useCORS: true, letterRendering: true }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape', compress: true } 
            };
            html2pdf().from(element).set(opt).save().then(() => { document.getElementById('printTitleHeader').style.display = 'none'; });
        }

        function printReport() { window.print(); }

        function openComparisonWindow() {
