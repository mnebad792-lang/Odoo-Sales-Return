<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحليل ومقارنة الفرق والمناديب (مبيعات، مرتجعات، صافي والاتجاهات)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --dark-color: #1e293b;
            --bg-color: #f8fafc;
            --border-color: #cbd5e1;
            --team-header-bg: #e2e8f0;
            --team-total-bg: #f1f5f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-color);
            margin: 0;
            padding: 8px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 12px;
            font-size: 16px;
        }

        .upload-section {
            background: #eff6ff;
            border: 2px dashed #3b82f6;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        #statusText {
            font-weight: bold;
            color: #1e40af;
            font-size: 11px;
        }

        .quick-search-panel {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .quick-search-title {
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 6px;
            color: #334155;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 6px;
            align-items: flex-end;
        }

        .search-field-group {
            display: flex;
            flex-direction: column;
        }

        .search-field-group label {
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 2px;
            color: #475569;
        }

        .search-field-group input, .search-field-group select {
            padding: 5px 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 10px;
            background: white;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-search-action {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            height: 27px;
            width: 100%;
        }
        .btn-search-action:hover { background-color: #1d4ed8; }

        .actions-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        button.action-btn {
            padding: 5px 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 11px;
        }
        .btn-reset { background-color: #64748b; }
        .btn-excel { background-color: var(--success-color); }
        .btn-pdf { background-color: #0284c7; }
        .btn-print { background-color: #4f46e5; }
        .btn-compare { background-color: #d97706; font-size: 11px; padding: 7px 12px; }

        .table-container {
            width: 100%;
            overflow-x: auto;
            max-height: 550px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        th, td {
            padding: 6px 8px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            border-left: 1px solid #e2e8f0;
            font-size: 8pt !important;
            white-space: normal;
            word-break: break-word;
        }

        th.col-rep, td.col-rep { min-width: 130px; text-align: right; }
        th.col-client, td.col-client { min-width: 200px; text-align: right; }
        th.col-product, td.col-product { min-width: 220px; text-align: right; }

        th {
            background-color: var(--dark-color);
            color: white;
            font-weight: bold !important;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .team-group-header {
            background-color: var(--team-header-bg) !important;
            font-weight: bold !important;
            color: #0f172a !important;
            text-align: right !important;
            font-size: 9pt !important;
            border-top: 2px solid #94a3b8;
        }

        .team-total-row {
            background-color: var(--team-total-bg) !important;
            font-weight: bold !important;
            color: #0369a1 !important;
            border-top: 1px solid #0284c7;
            border-bottom: 2px solid #0284c7;
        }

        tr:hover { background-color: #f8fafc; }

        .row-count {
            margin-top: 5px;
            font-weight: bold;
            color: #475569;
            font-size: 11px;
        }

        #reportModalContainer {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f8fafc;
            z-index: 9998;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container" id="mainAppContainer">
        <h2>نظام تحليل ومقارنة الفرق والمناديب (مبيعات، مرتجعات، صافي والاتجاهات)</h2>

        <div class="upload-section">
            <div>
                <span id="statusText">🔄 جاري جلب أحدث البيانات من سحابة OneDrive...</span>
            </div>
            <div>
                <button class="action-btn" onclick="loadCloudData()" style="font-size: 11px; background-color: #2563eb;">🔄 تحديث البيانات الآن</button>
            </div>
        </div>

        <div style="text-align: center; margin: 10px 0;">
            <button class="action-btn btn-compare" onclick="openTeamsAndRepsReport()">⚖️ عرض تقرير تسلسل الفرق والمناديب التفصيلي</button>
        </div>

        <div class="quick-search-panel">
            <div class="quick-search-title">🔍 محرك الفلاتر الشامل:</div>
            <div class="search-grid">
                <div class="search-field-group">
                    <label>العميل:</label>
                    <input type="text" id="searchClient" placeholder="ابحث عن العميل...">
                </div>
                <div class="search-field-group">
                    <label>مندوب المبيعات:</label>
                    <input type="text" id="searchRep" placeholder="ابحث عن المندوب...">
                </div>
                <div class="search-field-group">
                    <label>فريق المبيعات:</label>
                    <input type="text" id="searchTeam" placeholder="ابحث عن الفريق...">
                </div>
                <div class="search-field-group">
                    <label>السنة:</label>
                    <select id="filterYear">
                        <option value="">كل السنوات</option>
                    </select>
                </div>
                <div class="search-field-group">
                    <label>الشهر:</label>
                    <select id="filterMonth">
                        <option value="">كل الشهور</option>
                        <option value="1">يناير</option><option value="2">فبراير</option><option value="3">مارس</option>
                        <option value="4">أبريل</option><option value="5">مايو</option><option value="6">يونيو</option>
                        <option value="7">يوليو</option><option value="8">أغسطس</option><option value="9">سبتمبر</option>
                        <option value="10">أكتوبر</option><option value="11">نوفمبر</option><option value="12">ديسمبر</option>
                    </select>
                </div>
                <div>
                    <button class="btn-search-action" onclick="executeMainTableFiltering()">🔍 تطبيق الفلاتر</button>
                </div>
            </div>
        </div>

        <div class="actions-bar">
            <button class="action-btn btn-reset" onclick="resetFilter()">🔄 إعادة ضبط</button>
            <button class="action-btn btn-excel" onclick="exportToExcel()">📊 تصدير Excel</button>
            <button class="action-btn btn-pdf" onclick="exportToPDFFile()">📥 تصدير PDF</button>
            <button class="action-btn btn-print" onclick="printReport()">🖨️ طباعة</button>
        </div>

        <div class="row-count" id="rowCount">عدد السجلات الإجمالي: 0</div>

        <div class="table-container">
            <table id="mainTable">
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- نافذة التقرير التفصيلي -->
    <div id="reportModalContainer">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h2 style="margin: 0; color: #2563eb; font-size: 15px;">⚖️ تقرير تسلسل الفرق والمناديب (حسب السنوات، الفروق والمؤشرات)</h2>
            <button class="action-btn btn-reset" onclick="closeReportModal()">✖ العودة للقائمة الرئيسية</button>
        </div>

        <div class="quick-search-panel" style="margin-bottom: 10px;">
            <div class="search-grid">
                <div class="search-field-group">
                    <label>بحث بالفريق:</label>
                    <input type="text" id="popupTeam" placeholder="اسم الفريق...">
                </div>
                <div class="search-field-group">
                    <label>بحث بالمندوب:</label>
                    <input type="text" id="popupRep" placeholder="اسم المندوب...">
                </div>
                <div class="search-field-group">
                    <label>السنة:</label>
                    <select id="popupYear">
                        <option value="">كل السنوات</option>
                    </select>
                </div>
                <div class="search-field-group">
                    <label>الشهر:</label>
                    <select id="popupMonth">
                        <option value="">كل الشهور</option>
                        <option value="1">يناير</option><option value="2">فبراير</option><option value="3">مارس</option>
                        <option value="4">أبريل</option><option value="5">مايو</option><option value="6">يونيو</option>
                        <option value="7">يوليو</option><option value="8">أغسطس</option><option value="9">سبتمبر</option>
                        <option value="10">أكتوبر</option><option value="11">نوفمبر</option><option value="12">ديسمبر</option>
                    </select>
                </div>
                <div>
                    <button class="btn-search-action" onclick="applyPopupFilter()">🔍 تطبيق الفلاتر</button>
                </div>
            </div>
        </div>

        <div class="actions-bar" style="margin-bottom: 10px;">
            <button class="action-btn btn-print" onclick="window.print()">🖨️ طباعة التقرير</button>
        </div>

        <div class="table-container" style="max-height: 70vh;">
            <table id="popupTable">
                <thead id="popupHeader"></thead>
                <tbody id="popupBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let globalAllData = [];
        let tableHeaders = [];
        let masterYears = new Set();
        let detectedIndices = { teamIdx: -1, repIdx: -1, clientIdx: -1, productIdx: -1, dateIdx: -1, invoiceDateIdx: -1, valIdx: -1, invoiceColIndex: -1 };

        // رابط الـ OneDrive المباشر لملفك الكبير
        const ONEDRIVE_FILE_URL = 'https://1drv.ms/x/c/fb1c11d1e6f04a95/IQBDQ4wQw1xGQoxMW0b_praGAZqRtuL0AmKIn2KRwnf_mak?e=9hdzhR&download=1'; 

        function loadCloudData() {
            document.getElementById('statusText').innerText = `🔄 جاري تحميل الملف الضخم من OneDrive... يرجى الانتظار`;
            
            fetch(ONEDRIVE_FILE_URL)
                .then(response => {
                    if (!response.ok) throw new Error("تعذر الوصول لملف الـ OneDrive. تأكد من صحة صلاحيات المشاركة.");
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    let data = new Uint8Array(buffer);
                    let workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    let sheetName = workbook.SheetNames.includes("Data") ? "Data" : workbook.SheetNames[0];
                    let worksheet = workbook.Sheets[sheetName];
                    let jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                    let cleanRows = jsonRows.filter(row => row && row.some(cell => cell !== ""));

                    if (cleanRows && cleanRows.length > 0) {
                        tableHeaders = cleanRows[0];
                        globalAllData = cleanRows.slice(1);
                        document.getElementById('statusText').innerText = `✅ تم تحديث البيانات بنجاح (${globalAllData.length.toLocaleString()} سجل).`;
                        detectColumnsAutomatically();
                        extractYears();
                        renderTableRows(globalAllData);
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('statusText').innerText = `❌ خطأ في تحميل الملف من OneDrive. تأكد أن الرابط يدعم التنزيل المباشر أو جرب زر التحديث مرة أخرى.`;
                });
        }

        window.onload = function() { 
            loadCloudData(); 
        };

        function detectColumnsAutomatically() {
            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('فريق') || hStr.includes('team')) detectedIndices.teamIdx = idx;
                if (hStr.includes('مندوب') || hStr.includes('rep')) detectedIndices.repIdx = idx;
                if (hStr.includes('عميل') || hStr.includes('customer')) detectedIndices.clientIdx = idx;
                if (hStr.includes('منتج') || hStr.includes('item') || hStr.includes('product')) detectedIndices.productIdx = idx;
                if ((hStr.includes('تاريخ') || hStr.includes('date')) && hStr.includes('طلب')) detectedIndices.dateIdx = idx;
                if ((hStr.includes('تاريخ') || hStr.includes('date')) && hStr.includes('فاتورة')) detectedIndices.invoiceDateIdx = idx;
                if (hStr.includes('مبلغ') || hStr.includes('قيمة') || hStr.includes('بدون') || hStr.includes('إجمالي')) detectedIndices.valIdx = idx;
                if (hStr.includes('رقم') && (hStr.includes('فاتورة') || hStr.includes('invoice'))) detectedIndices.invoiceColIndex = idx;
            });
            if (detectedIndices.teamIdx === -1) detectedIndices.teamIdx = 0;
            if (detectedIndices.repIdx === -1) detectedIndices.repIdx = 1;
            if (detectedIndices.clientIdx === -1) detectedIndices.clientIdx = 2;
            if (detectedIndices.productIdx === -1) detectedIndices.productIdx = 3;
            if (detectedIndices.dateIdx === -1) detectedIndices.dateIdx = 4;
            if (detectedIndices.invoiceDateIdx === -1) {
                tableHeaders.forEach((h, idx) => {
                    let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                    if (hStr.includes('تاريخفاتورة') || (hStr.includes('تاريخ') && hStr.includes('فاتورة'))) detectedIndices.invoiceDateIdx = idx;
                });
            }
            if (detectedIndices.valIdx === -1) detectedIndices.valIdx = 5;
        }

        function parseRowDate(val) {
            if (!val && val !== 0) return null;
            if (val instanceof Date && !isNaN(val)) return val;
            if (typeof val === 'number' && val > 30000 && val < 60000) {
                let utcDays = Math.floor(val - 25569);
                return new Date(utcDays * 86400 * 1000);
            }
            let strVal = String(val).trim();
            strVal = strVal.replace(/\(.*\)/g, '').replace(/[\+\-]\d{2,4}/g, '').trim();
            let parts = strVal.split(/[\/\-\.]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                else if (parts[2].length === 4) return new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
            }
            let parsed = new Date(strVal);
            if (!isNaN(parsed)) return parsed;
            return null;
        }

        function formatDateClean(val) {
            let d = parseRowDate(val);
            if (!d) {
                let s = String(val !== undefined ? val : '');
                return s.replace(/\(.*\)/g, '').trim();
            }
            let yy = d.getFullYear();
            let mm = String(d.getMonth() + 1).padStart(2, '0');
            let dd = String(d.getDate()).padStart(2, '0');
            return `${yy}-${mm}-${dd}`;
        }

        function extractYears() {
            let dateIdx = detectedIndices.dateIdx;
            masterYears.clear();
            globalAllData.forEach(row => {
                if (dateIdx !== -1) {
                    let d = parseRowDate(row[dateIdx]);
                    if (d) masterYears.add(d.getFullYear());
                }
            });
            let yearSelect = document.getElementById('filterYear');
            let popupYearSelect = document.getElementById('popupYear');
            
            let yearsHtml = '<option value="">كل السنوات</option>';
            Array.from(masterYears).sort((a,b)=>a-b).forEach(y => {
                yearsHtml += `<option value="${y}">${y}</option>`;
            });
            yearSelect.innerHTML = yearsHtml;
            popupYearSelect.innerHTML = yearsHtml;
        }

        function renderTableRows(rowsToRender) {
            if (tableHeaders.length === 0) return;
            let headerHtml = '<tr>';
            tableHeaders.forEach((h, idx) => {
                let cssClass = '';
                if (idx === detectedIndices.repIdx) cssClass = 'col-rep';
                else if (idx === detectedIndices.clientIdx) cssClass = 'col-client';
                else if (idx === detectedIndices.productIdx) cssClass = 'col-product';
                headerHtml += `<th class="${cssClass}">${h}</th>`;
            });
            headerHtml += '</tr>';
            document.getElementById('tableHeader').innerHTML = headerHtml;

            let chunkSize = 500;
            let index = 0;
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let dateIdx = detectedIndices.dateIdx;
            let invoiceDateIdx = detectedIndices.invoiceDateIdx;

            function appendChunk() {
                let chunk = rowsToRender.slice(index, index + chunkSize);
                let bodyHtml = '';
                chunk.forEach(row => {
                    bodyHtml += '<tr>';
                    row.forEach((cell, cellIdx) => {
                        let displayVal = cell;
                        if (cellIdx === dateIdx || cellIdx === invoiceDateIdx || String(tableHeaders[cellIdx] || "").toLowerCase().includes('تاريخ')) {
                            displayVal = formatDateClean(cell);
                        }
                        let cssClass = '';
                        if (cellIdx === detectedIndices.repIdx) cssClass = 'col-rep';
                        else if (cellIdx === detectedIndices.clientIdx) cssClass = 'col-client';
                        else if (cellIdx === detectedIndices.productIdx) cssClass = 'col-product';

                        bodyHtml += `<td class="${cssClass}">${displayVal !== undefined ? displayVal : ''}</td>`;
                    });
                    bodyHtml += '</tr>';
                });
                tbody.insertAdjacentHTML('beforeend', bodyHtml);
                index += chunkSize;
                if (index < rowsToRender.length) {
                    setTimeout(appendChunk, 0);
                }
            }
            appendChunk();
            document.getElementById('rowCount').innerText = `عدد السجلات المعروضة: ${rowsToRender.length.toLocaleString()}`;
        }

        function executeMainTableFiltering() {
            let clientQ = document.getElementById('searchClient').value.toLowerCase().trim();
            let repQ = document.getElementById('searchRep').value.toLowerCase().trim();
            let teamQ = document.getElementById('searchTeam').value.toLowerCase().trim();
            let yearQ = document.getElementById('filterYear').value.trim();
            let monthQ = document.getElementById('filterMonth').value.trim();

            let clientIdx = detectedIndices.clientIdx;
            let repIdx = detectedIndices.repIdx;
            let teamIdx = detectedIndices.teamIdx;
            let dateIdx = detectedIndices.dateIdx;

            let filtered = globalAllData.filter(row => {
                if (clientQ && clientIdx !== -1 && !String(row[clientIdx] || "").toLowerCase().includes(clientQ)) return false;
                if (repQ && repIdx !== -1 && !String(row[repIdx] || "").toLowerCase().includes(repQ)) return false;
                if (teamQ && teamIdx !== -1 && !String(row[teamIdx] || "").toLowerCase().includes(teamQ)) return false;
                if (dateIdx !== -1) {
                    let d = parseRowDate(row[dateIdx]);
                    if (d) {
                        if (yearQ && String(d.getFullYear()) !== yearQ) return false;
                        if (monthQ && String(d.getMonth() + 1) !== monthQ) return false;
                    } else if (yearQ || monthQ) return false;
                }
                return true;
            });

            renderTableRows(filtered);
        }

        function resetFilter() {
            document.getElementById('searchClient').value = '';
            document.getElementById('searchRep').value = '';
            document.getElementById('searchTeam').value = '';
            document.getElementById('filterYear').value = '';
            document.getElementById('filterMonth').value = '';
            renderTableRows(globalAllData);
        }

        function calculateReportData(filterTeam = "", filterRep = "", filterYear = "", filterMonth = "") {
            let { teamIdx, repIdx, dateIdx, valIdx, invoiceColIndex } = detectedIndices;
            let hierarchy = {};
            let yearsSet = new Set();

            globalAllData.forEach(row => {
                let teamName = String(row[teamIdx] || "فريق غير محدد").trim();
                let repName = String(row[repIdx] || "مندوب غير محدد").trim();

                if (filterTeam && !teamName.toLowerCase().includes(filterTeam.toLowerCase())) return;
                if (filterRep && !repName.toLowerCase().includes(filterRep.toLowerCase())) return;

                let dObj = parseRowDate(row[dateIdx]);
                let year = dObj ? dObj.getFullYear() : "غير محدد";
                let month = dObj ? (dObj.getMonth() + 1) : "غير محدد";

                if (filterYear && String(year) !== String(filterYear)) return;
                if (filterMonth && String(month) !== String(filterMonth)) return;

                let amount = Number(row[valIdx]) || 0;
                let isReturn = false;
                if (invoiceColIndex !== -1 && row[invoiceColIndex]) {
                    if (String(row[invoiceColIndex]).trim().toLowerCase().startsWith('rinv')) isReturn = true;
                }

                if (year !== "غير محدد") yearsSet.add(year);

                if (!hierarchy[teamName]) hierarchy[teamName] = {};
                if (!hierarchy[teamName][repName]) hierarchy[teamName][repName] = {};
                if (!hierarchy[teamName][repName][year]) hierarchy[teamName][repName][year] = { sales: 0, returns: 0 };

                if (isReturn) hierarchy[teamName][repName][year].returns += Math.abs(amount);
                else hierarchy[teamName][repName][year].sales += amount;
            });

            let sortedYears = Array.from(yearsSet).sort((a, b) => a - b);
            if (sortedYears.length === 0) sortedYears = [2025, 2026];

            let topHeaderHtml = `<tr><th rowspan="2">الفريق / المندوب</th>`;
            sortedYears.forEach(y => {
                topHeaderHtml += `<th colspan="3" style="background:#0284c7; border-left:2px solid #94a3b8;">سنة ${y}</th>`;
            });
            topHeaderHtml += `<th colspan="3" style="background:#d97706; border-left:2px solid #94a3b8;">الفرق (مقارنة)</th>`;
            topHeaderHtml += `<th rowspan="2" style="background:#1e293b;">الاتجاه العام</th></tr>`;

            let subHeaderHtml = `<tr>`;
            sortedYears.forEach(() => {
                subHeaderHtml += `
                    <th style="background:#38bdf8;">مبيعات</th>
                    <th style="background:#f87171;">مرتجعات</th>
                    <th style="background:#4ade80; border-left:2px solid #94a3b8;">صافي</th>
                `;
            });
            subHeaderHtml += `
                <th style="background:#fbbf24;">فارق مبيعات</th>
                <th style="background:#fca5a5;">فارق مرتجعات</th>
                <th style="background:#86efac; border-left:2px solid #94a3b8;">فارق صافي</th>
            `;
            subHeaderHtml += `</tr>`;

            let tableRowsHtml = '';
            let grandTotals = {};
            sortedYears.forEach(y => { grandTotals[y] = { sales: 0, returns: 0 }; });

            Object.keys(hierarchy).sort().forEach(team => {
                tableRowsHtml += `<tr class="team-group-header"><td colspan="${(sortedYears.length * 3) + 5}" style="text-align:right; padding:6px;">📁 الفريق: ${team}</td></tr>`;

                let teamTotals = {};
                sortedYears.forEach(y => { teamTotals[y] = { sales: 0, returns: 0 }; });

                Object.keys(hierarchy[team]).sort().forEach(rep => {
                    tableRowsHtml += `<tr><td style="text-align:right; padding-right:15px;">👤 ${rep}</td>`;
                    let repYearsData = hierarchy[team][rep];

                    sortedYears.forEach(y => {
                        let yData = repYearsData[y] || { sales: 0, returns: 0 };
                        let netY = yData.sales - yData.returns;
                        teamTotals[y].sales += yData.sales;
                        teamTotals[y].returns += yData.returns;

                        tableRowsHtml += `
                            <td>${yData.sales.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                            <td style="color:#dc2626;">${yData.returns.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                            <td style="font-weight:bold; color:#16a34a; border-left:2px solid #94a3b8;">${netY.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                        `;
                    });

                    let diffSales = 0, diffReturns = 0, diffNet = 0;
                    if (sortedYears.length >= 2) {
                        let yFirst = sortedYears[0];
                        let yLast = sortedYears[sortedYears.length - 1];
                        let fSales = repYearsData[yLast]?.sales || 0;
                        let fBaseSales = repYearsData[yFirst]?.sales || 0;
                        diffSales = fSales - fBaseSales;

                        let fReturns = repYearsData[yLast]?.returns || 0;
                        let fBaseReturns = repYearsData[yFirst]?.returns || 0;
                        diffReturns = fReturns - fBaseReturns;

                        let fNet = (repYearsData[yLast]?.sales || 0) - (repYearsData[yLast]?.returns || 0);
                        let fBaseNet = (repYearsData[yFirst]?.sales || 0) - (repYearsData[yFirst]?.returns || 0);
                        diffNet = fNet - fBaseNet;
                    }

                    tableRowsHtml += `
                        <td style="font-weight:bold; color:${diffSales >= 0 ? '#16a34a':'#dc2626'};">${diffSales.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                        <td style="font-weight:bold; color:${diffReturns <= 0 ? '#16a34a':'#dc2626'};">${diffReturns.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                        <td style="font-weight:bold; color:${diffNet >= 0 ? '#16a34a':'#dc2626'}; border-left:2px solid #94a3b8;">${diffNet.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    `;

                    let trend = '<span style="color:#64748b;">⚪ ثبات</span>';
                    if (diffNet > 0) trend = '<span style="color:#16a34a; font-weight:bold;">🟢 نمو</span>';
                    else if (diffNet < 0) trend = '<span style="color:#dc2626; font-weight:bold;">🔴 انخفاض</span>';

                    tableRowsHtml += `<td>${trend}</td></tr>`;
                });

                tableRowsHtml += `<tr class="team-total-row"><td style="text-align:right; font-weight:bold;">📊 إجمالي فريق: ${team}</td>`;
                let tTeamSalesFirst = 0, tTeamSalesLast = 0, tTeamReturnsFirst = 0, tTeamReturnsLast = 0, tTeamNetFirst = 0, tTeamNetLast = 0;

                sortedYears.forEach((y, idx) => {
                    let tSales = teamTotals[y].sales;
                    let tReturns = teamTotals[y].returns;
                    let tNet = tSales - tReturns;
                    grandTotals[y].sales += tSales;
                    grandTotals[y].returns += tReturns;

                    if (idx === 0) { tTeamSalesFirst = tSales; tTeamReturnsFirst = tReturns; tTeamNetFirst = tNet; }
                    if (idx === sortedYears.length - 1) { tTeamSalesLast = tSales; tTeamReturnsLast = tReturns; tTeamNetLast = tNet; }

                    tableRowsHtml += `
                        <td>${tSales.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                        <td style="color:#dc2626;">${tReturns.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                        <td style="color:#16a34a; border-left:2px solid #94a3b8;">${tNet.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    `;
                });

                let teamDiffSales = tTeamSalesLast - tTeamSalesFirst;
                let teamDiffReturns = tTeamReturnsLast - tTeamReturnsFirst;
                let teamDiffNet = tTeamNetLast - tTeamNetFirst;
                let teamTrend = '<span style="color:#64748b;">⚪ ثبات</span>';
                if (teamDiffNet > 0) teamTrend = '<span style="color:#16a34a; font-weight:bold;">🟢 نمو</span>';
                else if (teamDiffNet < 0) teamTrend = '<span style="color:#dc2626; font-weight:bold;">🔴 انخفاض</span>';

                tableRowsHtml += `
                    <td style="font-weight:bold; color:${teamDiffSales >= 0 ? '#16a34a':'#dc2626'};">${teamDiffSales.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    <td style="font-weight:bold; color:${teamDiffReturns <= 0 ? '#16a34a':'#dc2626'};">${teamDiffReturns.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    <td style="font-weight:bold; color:${teamDiffNet >= 0 ? '#16a34a':'#dc2626'}; border-left:2px solid #94a3b8;">${teamDiffNet.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    <td>${teamTrend}</td>
                </tr>`;
            });

            return { topHeaderHtml, subHeaderHtml, tableRowsHtml };
        }

        function openTeamsAndRepsReport() {
            if (globalAllData.length === 0) { alert("جاري تحميل البيانات من السحابة، يرجى الانتظار..."); return; }
            applyPopupFilter();
            document.getElementById('reportModalContainer').style.display = 'block';
        }

        function applyPopupFilter() {
            let fTeam = document.getElementById('popupTeam').value;
            let fRep = document.getElementById('popupRep').value;
            let fYear = document.getElementById('popupYear').value;
            let fMonth = document.getElementById('popupMonth').value;
            
            let res = calculateReportData(fTeam, fRep, fYear, fMonth);
            document.getElementById('popupHeader').innerHTML = res.topHeaderHtml + res.subHeaderHtml;
            document.getElementById('popupBody').innerHTML = res.tableRowsHtml;
        }

        function closeReportModal() { document.getElementById('reportModalContainer').style.display = 'none'; }
        function exportToExcel() { alert("استخدم نافذة التقرير التفصيلي للطباعة والتصدير المناسب."); }
        function exportToPDFFile() { window.print(); }
        function printReport() { window.print(); }
    </script>
</body>
</html>
