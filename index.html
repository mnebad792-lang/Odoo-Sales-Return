<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام بحث وتصدير مبيعات الشركة المركزي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --dark-color: #1e293b;
            --bg-color: #f8fafc;
            --border-color: #cbd5e1;
            --return-row-bg: #fee2e2;
            --totals-bg: #e0f2fe;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-color);
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 15px;
            font-size: 18px;
        }

        .upload-section {
            background: #eff6ff;
            border: 2px dashed #3b82f6;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .upload-section input[type="file"] { display: none; }

        .custom-file-upload {
            background-color: #2563eb;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
            transition: background 0.2s;
        }
        .custom-file-upload:hover { background-color: #1d4ed8; }

        #statusText {
            font-weight: bold;
            color: #1e40af;
            font-size: 12px;
        }

        .quick-search-panel {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .quick-search-title {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 8px;
            color: #334155;
        }

        .search-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }

        .search-field-group {
            flex: 1;
            min-width: 140px;
            display: flex;
            flex-direction: column;
        }

        .search-field-group label {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #475569;
        }

        .search-field-group input, .search-field-group select {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 11px;
            background: white;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-search-action {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            height: 31px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-search-action:hover { background-color: #1d4ed8; }

        .actions-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        button.action-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }
        .btn-reset { background-color: #64748b; }
        .btn-excel { background-color: var(--success-color); }
        .btn-pdf { background-color: #0284c7; }
        .btn-print { background-color: #4f46e5; }
        .btn-compare { background-color: #d97706; font-size: 12px; padding: 8px 14px; }
        .btn-compare-client { background-color: #0d9488; font-size: 12px; padding: 8px 14px; }

        .table-container {
            width: 100%;
            overflow-x: auto;
            max-height: 550px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
        }

        /* تعديلات Shrink to Fit للجداول الرئيسية والفرعية */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* تفعيل خاصية احتواء وتوزيع الأعمدة بالتساوي أو حسب المحتوى */
        }

        th, td {
            padding: 4px 3px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
            border-left: 1px solid #e2e8f0;
            font-size: 7pt !important;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap; /* منع انقسام السطور وضمان ملاءمة المحتوى */
        }

        th {
            background-color: var(--dark-color);
            color: white;
            font-weight: bold !important;
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 7.5pt !important;
            text-align: center;
            white-space: normal; /* السماح بالتفاف العنوان إذا كان طويلاً */
        }

        tr.totals-row td {
            background-color: var(--totals-bg) !important;
            font-weight: bold !important;
            color: #0369a1 !important;
            border-top: 2px solid #0284c7;
            border-bottom: 2px solid #0284c7;
            position: sticky;
            top: 28px;
            z-index: 8;
            font-size: 7pt !important;
            white-space: nowrap !important;
            text-align: center;
        }

        tr:hover { background-color: #f1f5f9; }
        tr.return-row { background-color: var(--return-row-bg) !important; }

        .row-count {
            margin-top: 6px;
            font-weight: bold;
            color: #475569;
            font-size: 12px;
        }

        .print-title-header {
            display: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="container" id="reportContent">
        <h2>نظام بحث وتصدير مبيعات الشركة المركزي</h2>

        <div class="upload-section">
            <div>
                <span id="statusText">📂 جاري التحقق من وجود بيانات مخزنة مسبقاً...</span>
            </div>
            <div>
                <label for="excelFileinput" class="custom-file-upload" id="uploadLabel">
                    📁 اختيار ملف الاكسيل (Excel)
                </label>
                <input type="file" id="excelFileinput" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)">
            </div>
        </div>

        <div style="text-align: center; margin: 15px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
            <button class="action-btn btn-compare" onclick="openComparisonWindow()">⚖️ تقرير مقارنة السنوات (للمندوبين والفرق)</button>
            <button class="action-btn btn-compare-client" onclick="openClientComparisonWindow()">⚖️ تقرير مقارنة السنوات (للعملاء)</button>
        </div>

        <div class="quick-search-panel">
            <div class="quick-search-title">🔍 محرك البحث السريع:</div>
            <div class="search-grid">
                <div class="search-field-group">
                    <label>العميل:</label>
                    <input type="text" id="searchClient" placeholder="اسم العميل..." oninput="executeFiltering()">
                </div>
                <div class="search-field-group">
                    <label>مندوب المبيعات:</label>
                    <input type="text" id="searchRep" placeholder="اسم المندوب..." oninput="executeFiltering()">
                </div>
                <div class="search-field-group">
                    <label>فريق المبيعات:</label>
                    <input type="text" id="searchTeam" placeholder="فريق المبيعات..." oninput="executeFiltering()">
                </div>
                <div class="search-field-group">
                    <label>المنتج / الصنف:</label>
                    <input type="text" id="searchItem" placeholder="الصنف..." oninput="executeFiltering()">
                </div>
                <div>
                    <button class="btn-search-action" onclick="executeFiltering()">🔍 بحث</button>
                </div>
            </div>
        </div>

        <div class="actions-bar">
            <button class="action-btn btn-reset" onclick="resetFilter()">🔄 إعادة ضبط كافة الفلاتر</button>
            <button class="action-btn btn-excel" onclick="exportToExcel()">📊 تصدير Excel (بدون مرتجعات)</button>
            <button class="action-btn btn-pdf" onclick="exportToPDFFile()">📥 تصدير PDF بالعرض</button>
            <button class="action-btn btn-print" onclick="printReport()">🖨️ طباعة التقرير</button>
        </div>

        <div id="printTitleHeader" class="print-title-header">تقرير مبيعات الشركة</div>
        <div class="row-count" id="rowCount">عدد النتائج المعروضة: 0</div>

        <div class="table-container">
            <table id="mainTable">
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let globalAllData = [];
        let tableHeaders = [];
        let displayedRowsData = []; 
        let exportableRowsData = []; 
        let db;

        function initDB() {
            let request = indexedDB.open("SalesSystemDB", 30);
            request.onsuccess = function(event) {
                db = event.target.result;
                loadStoredData();
            };
            request.onupgradeneeded = function(event) {
                let dbTarget = event.target.result;
                if (!dbTarget.objectStoreNames.contains("files")) {
                    dbTarget.createObjectStore("files");
                }
            };
        }

        function saveToDB(headers, data, fileName) {
            if (!db) return;
            let transaction = db.transaction(["files"], "readwrite");
            let store = transaction.objectStore("files");
            store.put({ headers: headers, data: data, name: fileName }, "excelFile");
        }

        function loadStoredData() {
            if (!db) return;
            let transaction = db.transaction(["files"], "readonly");
            let store = transaction.objectStore("files");
            let request = store.get("excelFile");

            request.onsuccess = function(event) {
                let result = event.target.result;
                if (result && result.data && result.data.length > 0) {
                    tableHeaders = result.headers;
                    globalAllData = result.data;
                    displayedRowsData = [...globalAllData];
                    exportableRowsData = [...globalAllData];
                    document.getElementById('statusText').innerText = `⚡ تم استرجاع الملف المخزن بنجاح (${globalAllData.length} سجل).`;
                    document.getElementById('uploadLabel').innerText = '📁 استبدال الملف';
                    renderTable();
                } else {
                    document.getElementById('statusText').innerText = `📂 يرجى اختيار ملف الاكسيل الخاص بالبيانات للبدء...`;
                }
            };
        }

        window.onload = function() { initDB(); };

        function formatExcelDate(val) {
            if (!val && val !== 0) return "";
            if (val instanceof Date && !isNaN(val)) {
                let d = String(val.getDate()).padStart(2, '0');
                let m = String(val.getMonth() + 1).padStart(2, '0');
                let y = val.getFullYear();
                return `${d}/${m}/${y}`;
            }
            if (typeof val === 'number' && val > 30000 && val < 60000) {
                let utcDays = Math.floor(val - 25569);
                let utcValue = utcDays * 86400;
                let dateInfo = new Date(utcValue * 1000);
                let d = String(dateInfo.getUTCDate()).padStart(2, '0');
                let m = String(dateInfo.getUTCMonth() + 1).padStart(2, '0');
                let y = String(dateInfo.getUTCFullYear());
                return `${d}/${m}/${y}`;
            }
            let strVal = String(val).trim();
            let parts = strVal.split(/[\/\-\.]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
                } else if (parts[2].length === 4) {
                    return `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[2]}`;
                }
            }
            return strVal;
        }

        function formatNumberCell(val) {
            if (val === "" || val === null || val === undefined) return "";
            let num = Number(val);
            if (!isNaN(num) && typeof val !== 'boolean') {
                let str = String(val).trim();
                if (str.length >= 10 && str.startsWith("0")) return str;
                return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            return val;
        }

        function handleExcelUpload(e) {
            let file = e.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    let sheetName = workbook.SheetNames.includes("Data") ? "Data" : workbook.SheetNames[0];
                    let worksheet = workbook.Sheets[sheetName];
                    let jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                    let cleanRows = jsonRows.filter(row => row && row.some(cell => cell !== ""));

                    if (cleanRows && cleanRows.length > 0) {
                        tableHeaders = cleanRows[0];
                        globalAllData = cleanRows.slice(1);
                        displayedRowsData = [...globalAllData];
                        exportableRowsData = [...globalAllData];
                        saveToDB(tableHeaders, globalAllData, file.name);
                        document.getElementById('statusText').innerText = `⚡ تم تحميل وحفظ الملف بنجاح (${globalAllData.length} سجل).`;
                        document.getElementById('uploadLabel').innerText = '📁 استبدال الملف';
                        renderTable();
                    } else {
                        alert("الملف المختار فارغ!");
                    }
                } catch (err) {
                    console.error(err);
                    alert("حدث خطأ أثناء قراءة الملف.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function getDynamicReportTitle() {
            let clientVal = document.getElementById('searchClient').value.trim();
            let repVal = document.getElementById('searchRep').value.trim();
            let teamVal = document.getElementById('searchTeam').value.trim();
            let itemVal = document.getElementById('searchItem').value.trim();
            let titleParts = ["تقرير مبيعات الشركة"];
            if (clientVal) titleParts.push(`للعميل: ${clientVal}`);
            if (repVal) titleParts.push(`للمندوب: ${repVal}`);
            if (teamVal) titleParts.push(`للفريق: ${teamVal}`);
            if (itemVal) titleParts.push(`للصنف: ${itemVal}`);
            return titleParts.join(" - ");
        }

        function executeFiltering() {
            let clientQuery = document.getElementById('searchClient').value.toLowerCase().trim();
            let repQuery = document.getElementById('searchRep').value.toLowerCase().trim();
            let teamQuery = document.getElementById('searchTeam').value.toLowerCase().trim();
            let itemQuery = document.getElementById('searchItem').value.toLowerCase().trim();

            let clientIdx = -1, repIdx = -1, teamIdx = -1, itemIdx = -1;
            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('عميل') || hStr.includes('customer')) clientIdx = idx;
                if (hStr.includes('مندوب') || hStr.includes('rep')) repIdx = idx;
                if (hStr.includes('فريق') || hStr.includes('team')) teamIdx = idx;
                if (hStr.includes('منتج') || hStr.includes('صنف') || hStr.includes('item')) itemIdx = idx;
            });

            let parseTerms = (q) => !q ? [] : q.split(/[,،]+/).map(t => t.trim()).filter(t => t.length > 0);
            let clientTerms = parseTerms(clientQuery);
            let repTerms = parseTerms(repQuery);
            let teamTerms = parseTerms(teamQuery);
            let itemTerms = parseTerms(itemQuery);

            exportableRowsData = globalAllData.filter(row => {
                if (clientTerms.length > 0 && clientIdx !== -1 && !clientTerms.some(term => String(row[clientIdx] || "").toLowerCase().includes(term))) return false;
                if (repTerms.length > 0 && repIdx !== -1 && !repTerms.some(term => String(row[repIdx] || "").toLowerCase().includes(term))) return false;
                if (teamTerms.length > 0 && teamIdx !== -1 && !teamTerms.some(term => String(row[teamIdx] || "").toLowerCase().includes(term))) return false;
                if (itemTerms.length > 0 && itemIdx !== -1 && !itemTerms.some(term => String(row[itemIdx] || "").toLowerCase().includes(term))) return false;
                return true;
            });

            displayedRowsData = [...exportableRowsData];
            document.getElementById('printTitleHeader').innerText = getDynamicReportTitle();
            renderTableBodyAndTotals();
        }

        function renderTable() {
            if (tableHeaders.length === 0) return;
            let headerHtml = '<tr>';
            tableHeaders.forEach((h) => { headerHtml += `<th>${h !== undefined ? h : ''}</th>`; });
            headerHtml += '</tr>';
            document.getElementById('tableHeader').innerHTML = headerHtml;
            executeFiltering();
        }

        function renderTableBodyAndTotals() {
            let bodyHtml = '';
            let invoiceColIndex = -1;
            let dateColIndices = [];
            let qtyColIndex = -1, discountValColIndex = -1, totalWithoutVatColIndex = -1, totalWithVatColIndex = -1;

            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('رقم') && (hStr.includes('فاتورة') || hStr.includes('invoice'))) invoiceColIndex = idx;
                if (hStr.includes('تاريخ') || hStr.includes('date')) dateColIndices.push(idx);
                if (hStr.includes('كمية') && hStr.includes('مفوترة')) qtyColIndex = idx;
                if (hStr.includes('مبلغ') && hStr.includes('خصم')) discountValColIndex = idx;
                
                if ((hStr.includes('بدون') && hStr.includes('ض')) || hStr === 'المبلغ' || hStr.includes('القيمة') || (hStr.includes('إجمالي') && !hStr.includes('شامل') && !hStr.includes('ض'))) {
                    if (totalWithoutVatColIndex === -1) totalWithoutVatColIndex = idx;
                }
                if (hStr.includes('شامل') && hStr.includes('ض')) totalWithVatColIndex = idx;
            });

            let sumQty = 0, sumDiscount = 0, sumWithoutVat = 0, sumWithVat = 0;
            displayedRowsData.forEach(row => {
                if (qtyColIndex !== -1) sumQty += Number(row[qtyColIndex]) || 0;
                if (discountValColIndex !== -1) sumDiscount += Number(row[discountValColIndex]) || 0;
                if (totalWithoutVatColIndex !== -1) sumWithoutVat += Number(row[totalWithoutVatColIndex]) || 0;
                if (totalWithVatColIndex !== -1) sumWithVat += Number(row[totalWithVatColIndex]) || 0;
            });

            let totalsRowHtml = '<tr class="totals-row">';
            tableHeaders.forEach((h, idx) => {
                let valStr = "";
                if (idx === 0) valStr = "الإجمالي:";
                else if (idx === qtyColIndex) valStr = sumQty.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                else if (idx === discountValColIndex) valStr = sumDiscount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                else if (idx === totalWithoutVatColIndex) valStr = sumWithoutVat.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                else if (idx === totalWithVatColIndex) valStr = sumWithVat.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                totalsRowHtml += `<td>${valStr}</td>`;
            });
            totalsRowHtml += '</tr>';

            displayedRowsData.slice(0, 1000).forEach(row => {
                let isReturn = false;
                if (invoiceColIndex !== -1 && row[invoiceColIndex]) {
                    let invVal = String(row[invoiceColIndex]).trim().toLowerCase();
                    if (invVal.startsWith('rinv')) isReturn = true;
                }
                bodyHtml += `<tr class="${isReturn ? 'return-row' : ''}">`;
                row.forEach((cell, cellIdx) => {
                    let formattedVal = dateColIndices.includes(cellIdx) ? formatExcelDate(cell) : formatNumberCell(cell);
                    bodyHtml += `<td>${formattedVal !== undefined && formattedVal !== null ? formattedVal : ''}</td>`;
                });
                bodyHtml += '</tr>';
            });

            let currentHeaderHtml = '<tr>';
            tableHeaders.forEach((h) => { currentHeaderHtml += `<th>${h !== undefined ? h : ''}</th>`; });
            currentHeaderHtml += '</tr>' + totalsRowHtml;

            document.getElementById('tableHeader').innerHTML = currentHeaderHtml;
            document.getElementById('tableBody').innerHTML = bodyHtml;
            document.getElementById('rowCount').innerText = `عدد النتائج المعروضة: ${displayedRowsData.length}`;
        }

        function resetFilter() {
            document.getElementById('searchClient').value = '';
            document.getElementById('searchRep').value = '';
            document.getElementById('searchTeam').value = '';
            document.getElementById('searchItem').value = '';
            displayedRowsData = [...globalAllData];
            exportableRowsData = [...globalAllData];
            renderTableBodyAndTotals();
            document.getElementById('printTitleHeader').innerText = "تقرير مبيعات الشركة";
            document.getElementById('statusText').innerText = `⚡ تم إعادة ضبط كافة الفلاتر وعرض كافة السجلات.`;
        }

        function exportToExcel() {
            if (exportableRowsData.length === 0) { alert("لا توجد بيانات للتصدير!"); return; }
            let invoiceColIndex = -1;
            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('رقم') && (hStr.includes('فاتورة') || hStr.includes('invoice'))) invoiceColIndex = idx;
            });
            let cleanExportRows = exportableRowsData.filter(row => {
                if (invoiceColIndex !== -1 && row[invoiceColIndex]) {
                    if (String(row[invoiceColIndex]).trim().toLowerCase().startsWith('rinv')) return false;
                }
                return true;
            });
            let reportTitle = getDynamicReportTitle();
            let exportData = [[reportTitle], [], tableHeaders, ...cleanExportRows];
            let ws = XLSX.utils.aoa_to_sheet(exportData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "التقرير");
            XLSX.writeFile(wb, reportTitle.replace(/[:\/\\?*]/g, "_") + ".xlsx");
        }

        function exportToPDFFile() {
            if (exportableRowsData.length === 0) { alert("لا توجد بيانات للتصدير!"); return; }
            document.getElementById('printTitleHeader').style.display = 'block';
            let element = document.getElementById('reportContent');
            let opt = { margin: 5, filename: getDynamicReportTitle() + '.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } };
            html2pdf().from(element).set(opt).save().then(() => { document.getElementById('printTitleHeader').style.display = 'none'; });
        }

        function printReport() { window.print(); }

        // --- 1. نافذة مقارنة السنوات (المندوبين والفرق) ---
        function openComparisonWindow() {
            if (globalAllData.length === 0) { alert("يرجى تحميل ملف البيانات أولاً لاستخراج تقرير المقارنة!"); return; }

            let repIdx = -1, teamIdx = -1;
            tableHeaders.forEach((h, idx) => {

            let teamsList = new Set();

                if (teamIdx !== -1 && row[teamIdx]) teamsList.add(String(row[teamIdx]).trim());
            });

            let repOptions = '<option value="">كل المندوبين</option>' + Array.from(repsList).sort().map(r => `<option value="${r}">${r}</option>`).join('');
            let teamOptions = '<option value="">كل الفرق</option>' + Array.from(teamsList).sort().map(t => `<option value="${t}">${t}</option>`).join('');
            
            let monthsOptions = '<option value="">كل الشهور</option>';
            for(let i=1; i<=12; i++) {
                let mStr = String(i).padStart(2, '0');
                monthsOptions += `<option value="${mStr}">شهر ${mStr}</option>`;
            }

            let daysOptions = '<option value="">كل الأيام</option>';
            for(let i=1; i<=31; i++) {
                let dStr = String(i).padStart(2, '0');
                daysOptions += `<option value="${dStr}">يوم ${dStr}</option>`;
            }

            let compWindow = window.open('', '_blank', 'width=1400,height=750,scrollbars=yes,resizable=yes');
            
            compWindow.document.write(`

                    <style>

                        .search-field-group label { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #475569; }
                        .search-field-group input, .search-field-group select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px; background: white; outline: none; width: 100%; box-sizing: border-box; }

                        .btn-pdf { background-color: #0284c7; }
                        .btn-print { background-color: #4f46e5; }
                        .table-container { width: 100%; overflow-x: auto; max-height: 520px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
                        
                        /* تطبيق Shrink to Fit على الجداول الفرعية */
                        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
                        th, td { padding: 4px 3px; text-align: right; border-bottom: 1px solid #e2e8f0; border-left: 1px solid #e2e8f0; font-size: 7.5pt; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        let windowComparisonData = [];

        function runComparisonInWindow(win) {
            let doc = win.document;
            let y1 = doc.getElementById('wCompYear1').value.trim();
            let y2 = doc.getElementById('wCompYear2').value.trim();
            let filterRep = doc.getElementById('wCompRep').value.toLowerCase().trim();
            let filterTeam = doc.getElementById('wCompTeam').value.toLowerCase().trim();
            let filterMonth = doc.getElementById('wCompMonth').value.trim();
            let filterDay = doc.getElementById('wCompDay').value.trim();

            doc.getElementById('thY1Label').innerText = `سنة ${y1 || '2025'}`;
            doc.getElementById('thY2Label').innerText = `سنة ${y2 || '2026'}`;

            let repIdx = -1, teamIdx = -1, dateIdx = -1, invoiceColIndex = -1, totalWithoutVatIdx = -1;

            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('مندوب') || hStr.includes('rep')) repIdx = idx;
                if (hStr.includes('فريق') || hStr.includes('team')) teamIdx = idx;
                if (hStr.includes('تاريخ') || hStr.includes('date')) dateIdx = idx;
                if (hStr.includes('رقم') && (hStr.includes('فاتورة') || hStr.includes('invoice'))) invoiceColIndex = idx;
                
                if ((hStr.includes('بدون') && hStr.includes('ض')) || hStr === 'المبلغ' || hStr.includes('القيمة') || (hStr.includes('إجمالي') && !hStr.includes('شامل') && !hStr.includes('ض'))) {
                    if (totalWithoutVatIdx === -1) totalWithoutVatIdx = idx;
                }
            });

            let teamsMap = {};

            globalAllData.forEach(row => {
                let repName = repIdx !== -1 ? String(row[repIdx] || "").trim() : "مندوب غير مسجل";
                let teamName = teamIdx !== -1 ? String(row[teamIdx] || "").trim() : "فريق غير مسجل";
                if (!repName) repName = "مندوب غير مسجل";
                if (!teamName) teamName = "فريق غير مسجل";

                if (filterRep && repName.toLowerCase() !== filterRep) return;
                if (filterTeam && teamName.toLowerCase() !== filterTeam) return;

                let yearVal = "", monthVal = "", dayVal = "";
                if (dateIdx !== -1) {
                    let formattedDate = formatExcelDate(row[dateIdx]);
                    let parts = formattedDate.split('/');
                    if (parts.length === 3) {
                        dayVal = parts[0].padStart(2, '0');
                        monthVal = parts[1].padStart(2, '0');
                        yearVal = parts[2];
                    }
                }

                if (yearVal !== y1 && yearVal !== y2) return;
                if (filterMonth && monthVal !== filterMonth) return;
                if (filterDay && dayVal !== filterDay) return;

                let isReturn = false;
                if (invoiceColIndex !== -1 && row[invoiceColIndex]) {
                    if (String(row[invoiceColIndex]).trim().toLowerCase().startsWith('rinv')) isReturn = true;
                }

                let val = totalWithoutVatIdx !== -1 ? (Number(row[totalWithoutVatIdx]) || 0) : 0;

                if (!teamsMap[teamName]) teamsMap[teamName] = {};
                if (!teamsMap[teamName][repName]) {
                    teamsMap[teamName][repName] = { y1Sales: 0, y1Returns: 0, y2Sales: 0, y2Returns: 0 };
                }

                if (yearVal === y1) {
                    if (isReturn) teamsMap[teamName][repName].y1Returns += Math.abs(val);
                    else teamsMap[teamName][repName].y1Sales += val;
                } else if (yearVal === y2) {
                    if (isReturn) teamsMap[teamName][repName].y2Returns += Math.abs(val);
                    else teamsMap[teamName][repName].y2Sales += val;
                }
            });

            windowComparisonData = [];
            let bodyHtml = '';
            let tY1S = 0, tY1R = 0, tY1N = 0, tY2S = 0, tY2R = 0, tY2N = 0, tDS = 0, tDR = 0, tDN = 0;
            let totalRecordsCount = 0;

            for (let teamName in teamsMap) {
                let teamY1S = 0, teamY1R = 0, teamY1N = 0, teamY2S = 0, teamY2R = 0, teamY2N = 0, teamDS = 0, teamDR = 0, teamDN = 0;
                let teamRowsHtml = '';

                for (let repName in teamsMap[teamName]) {
                    let d = teamsMap[teamName][repName];
                    let y1Net = d.y1Sales - d.y1Returns;
                    let y2Net = d.y2Sales - d.y2Returns;
                    let diffSales = d.y2Sales - d.y1Sales;
                    let diffReturns = d.y2Returns - d.y1Returns;
                    let diffNet = y2Net - y1Net;
                    let growthRate = y1Net !== 0 ? (diffNet / Math.abs(y1Net)) * 100 : (y2Net > 0 ? 100 : 0);

                    teamY1S += d.y1Sales; teamY1R += d.y1Returns; teamY1N += y1Net;
                    teamY2S += d.y2Sales; teamY2R += d.y2Returns; teamY2N += y2Net;
                    teamDS += diffSales; teamDR += diffReturns; teamDN += diffNet;
                    totalRecordsCount++;

                    let badgeClass = "badge-flat", arrowSymbol = "➖ ثابت";
                    if (growthRate > 0) { badgeClass = "badge-up"; arrowSymbol = `📈 +${growthRate.toFixed(1)}%`; }
                    else if (growthRate < 0) { badgeClass = "badge-down"; arrowSymbol = `📉 ${growthRate.toFixed(1)}%`; }

                    windowComparisonData.push({
                        team: teamName, rep: repName,
                        y1Sales: d.y1Sales, y1Returns: d.y1Returns, y1Net: y1Net,
                        y2Sales: d.y2Sales, y2Returns: d.y2Returns, y2Net: y2Net,
                        diffSales: diffSales, diffReturns: diffReturns, diffNet: diffNet,
                        growthRate: growthRate
                    });

                    teamRowsHtml += `<tr>
                        <td style="color: #64748b; font-size: 7pt;">${teamName}</td>
                        <td style="font-weight: bold;">${repName}</td>
                        <td>${d.y1Sales.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td style="color: #dc2626;">${d.y1Returns.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td style="font-weight: bold; color: #2563eb;">${y1Net.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td>${d.y2Sales.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td style="color: #dc2626;">${d.y2Returns.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td style="font-weight: bold; color: #2563eb;">${y2Net.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td style="color: ${diffSales >= 0 ? '#16a34a' : '#dc2626'};">${diffSales.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td style="color: ${diffReturns <= 0 ? '#16a34a' : '#dc2626'};">${diffReturns.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td style="font-weight: bold; color: ${diffNet >= 0 ? '#16a34a' : '#dc2626'};">${diffNet.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td class="${badgeClass}">${arrowSymbol}</td>
                    </tr>`;
                }

                tY1S += teamY1S; tY1R += teamY1R; tY1N += teamY1N;
                tY2S += teamY2S; tY2R += teamY2R; tY2N += teamY2N;
                tDS += teamDS; tDR += teamDR; tDN += teamDN;

                let teamGrowth = teamY1N !== 0 ? (teamDN / Math.abs(teamY1N)) * 100 : 0;
                let teamArrow = teamGrowth > 0 ? `📈 +${teamGrowth.toFixed(1)}%` : (teamGrowth < 0 ? `📉 ${teamGrowth.toFixed(1)}%` : `➖ ثابت`);
                let teamBadgeClass = teamGrowth > 0 ? "badge-up" : (teamGrowth < 0 ? "badge-down" : "badge-flat");

                bodyHtml += `<tr class="team-total-row">
                    <td colspan="2">إجمالي فريق: ${teamName}</td>
                    <td>${teamY1S.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td>${teamY1R.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td>${teamY1N.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td>${teamY2S.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td>${teamY2R.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td>${teamY2N.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td>${teamDS.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td>${teamDR.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td>${teamDN.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td class="${teamBadgeClass}">${teamArrow}</td>
                </tr>` + teamRowsHtml;
            }

            let overallGrowth = tY1N !== 0 ? (tDN / Math.abs(tY1N)) * 100 : 0;
            let totalArrow = overallGrowth > 0 ? `📈 +${overallGrowth.toFixed(1)}%` : (overallGrowth < 0 ? `📉 ${overallGrowth.toFixed(1)}%` : `➖ ثابت`);
            let totalBadgeClass = overallGrowth > 0 ? "badge-up" : (overallGrowth < 0 ? "badge-down" : "badge-flat");

            let totalsRowHtml = `<tr class="totals-row">
                <td colspan="2">الإجمالي العام للمقارنة:</td>
                <td>${tY1S.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tY1R.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tY1N.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tY2S.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tY2R.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tY2N.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tDS.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tDR.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tDN.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td class="${totalBadgeClass}">${totalArrow}</td>
            </tr>`;

            doc.getElementById('wCompareTableBody').innerHTML = totalsRowHtml + bodyHtml;
            doc.getElementById('wCompareRowCount').innerText = `عدد السجلات المقارنة: ${totalRecordsCount}`;
        }

        function exportCompareWindowExcel(win) {
            if (windowComparisonData.length === 0) { alert("لا توجد بيانات للتصدير!"); return; }
            let y1 = win.document.getElementById('wCompYear1').value.trim() || '2025';
            let y2 = win.document.getElementById('wCompYear2').value.trim() || '2026';
            let headerRow = ["فريق المبيعات", "مندوب المبيعات", `مبيعات ${y1}`, `مرتجعات ${y1}`, `صافي ${y1}`, `مبيعات ${y2}`, `مرتجعات ${y2}`, `صافي ${y2}`, "فارق المبيعات", "فارق المرتجعات", "فارق الصافي", "نسبة النمو والاتجاه"];
            let rows = windowComparisonData.map(d => [d.team, d.rep, d.y1Sales, d.y1Returns, d.y1Net, d.y2Sales, d.y2Returns, d.y2Net, d.diffSales, d.diffReturns, d.diffNet, `${d.growthRate.toFixed(1)}%`]);
            let exportData = [[`تقرير مقارنة المبيعات بين ${y1} و ${y2}`], [], headerRow, ...rows];
            let ws = XLSX.utils.aoa_to_sheet(exportData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "مقارنة_السنوات");
            XLSX.writeFile(wb, `مقارنة_المبيعات_${y1}_مع_${y2}.xlsx`);
        }

        function exportCompareWindowPDF(win) {
            let element = win.document.getElementById('printArea');
            let opt = { margin: 5, filename: 'تقرير_مقارنة_المبيعات.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } };
            html2pdf().from(element).set(opt).save();
        }

        // --- 2. نافذة مقارنة السنوات (للعملاء فقط بدون مندوب أو فريق) ---
        function openClientComparisonWindow() {
            if (globalAllData.length === 0) { alert("يرجى تحميل ملف البيانات أولاً لاستخراج تقرير مقارنة العملاء!"); return; }

            let clientIdx = -1;
            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('عميل') || hStr.includes('customer')) clientIdx = idx;
            });

            let clientsList = new Set();
            globalAllData.forEach(row => {
                if (clientIdx !== -1 && row[clientIdx]) clientsList.add(String(row[clientIdx]).trim());
            });

            let clientOptions = '<option value="">كل العملاء</option>' + Array.from(clientsList).sort().map(c => `<option value="${c}">${c}</option>`).join('');
            
            let monthsOptions = '<option value="">كل الشهور</option>';
            for(let i=1; i<=12; i++) {
                let mStr = String(i).padStart(2, '0');
                monthsOptions += `<option value="${mStr}">شهر ${mStr}</option>`;
            }

            let daysOptions = '<option value="">كل الأيام</option>';
            for(let i=1; i<=31; i++) {
                let dStr = String(i).padStart(2, '0');
                daysOptions += `<option value="${dStr}">يوم ${dStr}</option>`;
            }

            let clientCompWindow = window.open('', '_blank', 'width=1300,height=750,scrollbars=yes,resizable=yes');
            
            clientCompWindow.document.write(`
                <!DOCTYPE html>
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <title>تقرير مقارنة السنوات للعملاء</title>
                    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>
                    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"><\/script>
                    <style>
                        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8fafc; color: #1e293b; padding: 15px; margin: 0; }
                        .container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
                        h2 { text-align: center; color: #1e293b; font-size: 16px; margin-bottom: 15px; }
                        .quick-search-panel { background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #cbd5e1; }
                        .quick-search-title { font-weight: bold; font-size: 12px; margin-bottom: 8px; color: #334155; }
                        .search-grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
                        .search-field-group { flex: 1; min-width: 140px; display: flex; flex-direction: column; }
                        .search-field-group label { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #475569; }
                        .search-field-group input, .search-field-group select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px; background: white; outline: none; width: 100%; box-sizing: border-box; }
                        .actions-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
                        button.action-btn { padding: 6px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 12px; }
                        .btn-excel { background-color: #16a34a; }
                        .btn-pdf { background-color: #0284c7; }
                        .btn-print { background-color: #4f46e5; }
                        .table-container { width: 100%; overflow-x: auto; max-height: 520px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
                        
                        /* تطبيق Shrink to Fit على جدول العملاء */
                        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
                        th, td { padding: 4px 3px; text-align: right; border-bottom: 1px solid #e2e8f0; border-left: 1px solid #e2e8f0; font-size: 7.5pt; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
                        th { background-color: #1e293b; color: white; font-weight: bold; position: sticky; top: 0; z-index: 10; text-align: center; white-space: normal; }
                        
                        tr.totals-row td { background-color: #e0f2fe !important; font-weight: bold !important; color: #0369a1 !important; border-top: 2px solid #0284c7; border-bottom: 2px solid #0284c7; position: sticky; top: 28px; z-index: 8; text-align: center; }
                        .badge-up { color: #16a34a; font-weight: bold; text-align: center; }
                        .badge-down { color: #dc2626; font-weight: bold; text-align: center; }
                        .badge-flat { color: #64748b; font-weight: bold; text-align: center; }
                        .row-count { margin-top: 6px; font-weight: bold; color: #475569; font-size: 12px; }
                        @media print {
                            @page { size: landscape; margin: 10mm; }
                            body { background: white; padding: 0; }
                            .container { box-shadow: none; padding: 0; }
                            .quick-search-panel, .actions-bar { display: none !important; }
                        }
                    </style>
                </head>
                <body>
                    <div class="container" id="clientPrintArea">
                        <h2>⚖️ تقرير مقارنة السنوات للعملاء - بدون ضريبة</h2>
                        
                        <div class="quick-search-panel">
                            <div class="quick-search-title">🎯 فلاتر تقرير مقارنة العملاء:</div>
                            <div class="search-grid">
                                <div class="search-field-group">
                                    <label>السنة الأولى:</label>
                                    <input type="text" id="wClientYear1" value="2025" oninput="window.opener.runClientComparisonInWindow(window)">
                                </div>
                                <div class="search-field-group">
                                    <label>السنة الثانية:</label>
                                    <input type="text" id="wClientYear2" value="2026" oninput="window.opener.runClientComparisonInWindow(window)">
                                </div>
                                <div class="search-field-group">
                                    <label>فلتر العميل:</label>
                                    <select id="wClientSelect" onchange="window.opener.runClientComparisonInWindow(window)">
                                        ${clientOptions}
                                    </select>
                                </div>
                                <div class="search-field-group">
                                    <label>فلتر الشهر:</label>
                                    <select id="wClientMonth" onchange="window.opener.runClientComparisonInWindow(window)">
                                        ${monthsOptions}
                                    </select>
                                </div>
                                <div class="search-field-group">
                                    <label>فلتر اليوم:</label>
                                    <select id="wClientDay" onchange="window.opener.runClientComparisonInWindow(window)">
                                        ${daysOptions}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="actions-bar">
                            <button class="action-btn btn-excel" onclick="window.opener.exportClientCompareWindowExcel(window)">📊 تصدير Excel</button>
                            <button class="action-btn btn-pdf" onclick="window.opener.exportClientCompareWindowPDF(window)">📥 تصدير PDF</button>
                            <button class="action-btn btn-print" onclick="window.print()">🖨️ طباعة التقرير</button>
                        </div>

                        <div class="row-count" id="wClientRowCount">عدد العملاء المعروضين: 0</div>

                        <div class="table-container">
                            <table id="wClientTable">
                                <thead>
                                    <tr>
                                        <th rowspan="2" style="vertical-align: middle;">اسم العميل</th>
                                        <th colspan="3" id="thClientY1Label">سنة 2025</th>
                                        <th colspan="3" id="thClientY2Label">سنة 2026</th>
                                        <th colspan="3">الفارق (التغير بين 25 و 26)</th>
                                        <th rowspan="2" style="vertical-align: middle;">نسبة النمو والاتجاه</th>
                                    </tr>
                                    <tr>
                                        <th>مبيعات</th><th>مرتجعات</th><th>صافي</th>
                                        <th>مبيعات</th><th>مرتجعات</th><th>صافي</th>
                                        <th>مبيعات</th><th>مرتجعات</th><th>صافي</th>
                                    </tr>
                                </thead>
                                <tbody id="wClientTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </body>
                </html>
            `);
            clientCompWindow.document.close();
            
            setTimeout(() => {
                runClientComparisonInWindow(clientCompWindow);
            }, 200);
        }

        let windowClientComparisonData = [];

        function runClientComparisonInWindow(win) {
            let doc = win.document;
            let y1 = doc.getElementById('wClientYear1').value.trim();
            let y2 = doc.getElementById('wClientYear2').value.trim();
            let filterClient = doc.getElementById('wClientSelect').value.toLowerCase().trim();
            let filterMonth = doc.getElementById('wClientMonth').value.trim();
            let filterDay = doc.getElementById('wClientDay').value.trim();

            doc.getElementById('thClientY1Label').innerText = `سنة ${y1 || '2025'}`;
            doc.getElementById('thClientY2Label').innerText = `سنة ${y2 || '2026'}`;

            let clientIdx = -1, dateIdx = -1, invoiceColIndex = -1, totalWithoutVatIdx = -1;

            tableHeaders.forEach((h, idx) => {
                let hStr = String(h || "").replace(/\s+/g, '').toLowerCase();
                if (hStr.includes('عميل') || hStr.includes('customer')) clientIdx = idx;
                if (hStr.includes('تاريخ') || hStr.includes('date')) dateIdx = idx;
                if (hStr.includes('رقم') && (hStr.includes('فاتورة') || hStr.includes('invoice'))) invoiceColIndex = idx;
                
                if ((hStr.includes('بدون') && hStr.includes('ض')) || hStr === 'المبلغ' || hStr.includes('القيمة') || (hStr.includes('إجمالي') && !hStr.includes('شامل') && !hStr.includes('ض'))) {
                    if (totalWithoutVatIdx === -1) totalWithoutVatIdx = idx;
                }
            });

            let clientsMap = {};

            globalAllData.forEach(row => {
                let clientName = clientIdx !== -1 ? String(row[clientIdx] || "").trim() : "عميل غير مسجل";
                if (!clientName) clientName = "عميل غير مسجل";

                if (filterClient && clientName.toLowerCase() !== filterClient) return;

                let yearVal = "", monthVal = "", dayVal = "";
                if (dateIdx !== -1) {
                    let formattedDate = formatExcelDate(row[dateIdx]);
                    let parts = formattedDate.split('/');
                    if (parts.length === 3) {
                        dayVal = parts[0].padStart(2, '0');
                        monthVal = parts[1].padStart(2, '0');
                        yearVal = parts[2];
                    }
                }

                if (yearVal !== y1 && yearVal !== y2) return;
                if (filterMonth && monthVal !== filterMonth) return;
                if (filterDay && dayVal !== filterDay) return;

                let isReturn = false;
                if (invoiceColIndex !== -1 && row[invoiceColIndex]) {
                    if (String(row[invoiceColIndex]).trim().toLowerCase().startsWith('rinv')) isReturn = true;
                }

                let val = totalWithoutVatIdx !== -1 ? (Number(row[totalWithoutVatIdx]) || 0) : 0;

                if (!clientsMap[clientName]) {
                    clientsMap[clientName] = { y1Sales: 0, y1Returns: 0, y2Sales: 0, y2Returns: 0 };
                }

                if (yearVal === y1) {
                    if (isReturn) clientsMap[clientName].y1Returns += Math.abs(val);
                    else clientsMap[clientName].y1Sales += val;
                } else if (yearVal === y2) {
                    if (isReturn) clientsMap[clientName].y2Returns += Math.abs(val);
                    else clientsMap[clientName].y2Sales += val;
                }
            });

            windowClientComparisonData = [];
            for (let clientName in clientsMap) {
                let d = clientsMap[clientName];
                let y1Net = d.y1Sales - d.y1Returns;
                let y2Net = d.y2Sales - d.y2Returns;
                let diffSales = d.y2Sales - d.y1Sales;
                let diffReturns = d.y2Returns - d.y1Returns;
                let diffNet = y2Net - y1Net;
                let growthRate = y1Net !== 0 ? (diffNet / Math.abs(y1Net)) * 100 : (y2Net > 0 ? 100 : 0);

                windowClientComparisonData.push({
                    client: clientName,
                    y1Sales: d.y1Sales, y1Returns: d.y1Returns, y1Net: y1Net,
                    y2Sales: d.y2Sales, y2Returns: d.y2Returns, y2Net: y2Net,
                    diffSales: diffSales, diffReturns: diffReturns, diffNet: diffNet,
                    growthRate: growthRate
                });
            }

            let bodyHtml = '';
            let tY1S = 0, tY1R = 0, tY1N = 0, tY2S = 0, tY2R = 0, tY2N = 0, tDS = 0, tDR = 0, tDN = 0;

            windowClientComparisonData.forEach(row => {
                tY1S += row.y1Sales; tY1R += row.y1Returns; tY1N += row.y1Net;
                tY2S += row.y2Sales; tY2R += row.y2Returns; tY2N += row.y2Net;
                tDS += row.diffSales; tDR += row.diffReturns; tDN += row.diffNet;

                let badgeClass = "badge-flat", arrowSymbol = "➖ ثابت";
                if (row.growthRate > 0) { badgeClass = "badge-up"; arrowSymbol = `📈 +${row.growthRate.toFixed(1)}%`; }
                else if (row.growthRate < 0) { badgeClass = "badge-down"; arrowSymbol = `📉 ${row.growthRate.toFixed(1)}%`; }

                bodyHtml += `<tr>
                    <td style="font-weight: bold;">${row.client}</td>
                    <td>${row.y1Sales.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td style="color: #dc2626;">${row.y1Returns.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td style="font-weight: bold; color: #2563eb;">${row.y1Net.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td>${row.y2Sales.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td style="color: #dc2626;">${row.y2Returns.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td style="font-weight: bold; color: #2563eb;">${row.y2Net.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td style="color: ${row.diffSales >= 0 ? '#16a34a' : '#dc2626'};">${row.diffSales.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td style="color: ${row.diffReturns <= 0 ? '#16a34a' : '#dc2626'};">${row.diffReturns.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td style="font-weight: bold; color: ${row.diffNet >= 0 ? '#16a34a' : '#dc2626'};">${row.diffNet.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td class="${badgeClass}">${arrowSymbol}</td>
                </tr>`;
            });

            let overallGrowth = tY1N !== 0 ? (tDN / Math.abs(tY1N)) * 100 : 0;
            let totalArrow = overallGrowth > 0 ? `📈 +${overallGrowth.toFixed(1)}%` : (overallGrowth < 0 ? `📉 ${overallGrowth.toFixed(1)}%` : `➖ ثابت`);
            let totalBadgeClass = overallGrowth > 0 ? "badge-up" : (overallGrowth < 0 ? "badge-down" : "badge-flat");

            let totalsRowHtml = `<tr class="totals-row">
                <td>الإجمالي العام للعملاء:</td>
                <td>${tY1S.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tY1R.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tY1N.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tY2S.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tY2R.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tY2N.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tDS.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tDR.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>${tDN.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td class="${totalBadgeClass}">${totalArrow}</td>
            </tr>`;

            doc.getElementById('wClientTableBody').innerHTML = totalsRowHtml + bodyHtml;
            doc.getElementById('wClientRowCount').innerText = `عدد العملاء المعروضين: ${windowClientComparisonData.length}`;
        }

        function exportClientCompareWindowExcel(win) {
            if (windowClientComparisonData.length === 0) { alert("لا توجد بيانات للتصدير!"); return; }
            let y1 = win.document.getElementById('wClientYear1').value.trim() || '2025';
            let y2 = win.document.getElementById('wClientYear2').value.trim() || '2026';
            let headerRow = ["اسم العميل", `مبيعات ${y1}`, `مرتجعات ${y1}`, `صافي ${y1}`, `مبيعات ${y2}`, `مرتجعات ${y2}`, `صافي ${y2}`, "فارق المبيعات", "فارق المرتجعات", "فارق الصافي", "نسبة النمو والاتجاه"];
            let rows = windowClientComparisonData.map(d => [d.client, d.y1Sales, d.y1Returns, d.y1Net, d.y2Sales, d.y2Returns, d.y2Net, d.diffSales, d.diffReturns, d.diffNet, `${d.growthRate.toFixed(1)}%`]);
            let exportData = [[`تقرير مقارنة مبيعات العملاء بين ${y1} و ${y2}`], [], headerRow, ...rows];
            let ws = XLSX.utils.aoa_to_sheet(exportData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "مقارنة_العملاء");
            XLSX.writeFile(wb, `مقارنة_العملاء_${y1}_مع_${y2}.xlsx`);
        }

        function exportClientCompareWindowPDF(win) {
            let element = win.document.getElementById('clientPrintArea');
            let opt = { margin: 5, filename: 'تقرير_مقارنة_العملاء.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } };
            html2pdf().from(element).set(opt).save();
        }
    </script>
</body>
</html>
